name: Port test harness (pre-merge)

# Direct PR harness for ordinary/human-created PRs plus manual rehearsal.
# Renovate's anchor PR is created by this repository's GITHUB_TOKEN, so GitHub
# creates its pull_request run only as a zero-job approval artifact that
# resolves to `failure` the instant the bot PR is auto-merged (observed
# 2026-11-04 run 41865549427, 2026-11-17 run 44013287701: 0 jobs, no logs,
# check suite `failure`). That artifact carries no harness result, yet it made
# the Actions tab permanently red at every upstream bump — alarm fatigue that
# hides real regressions. Therefore this workflow is NOT the sole authority for
# Renovate PRs: .github/workflows/auto-merge-upstream.yml runs the same
# syntax/compile/YAML/full harness in its workflow_run chain BEFORE any merge
# authority is exercised (step "Pre-merge harness (authoritative ...)").
#
# Narrow paths-ignore (2026-11-18): a Renovate bump PR changes EXACTLY one
# file, so ignoring that file stops the phantom run at dispatch time instead of
# at merge time. This is deliberately not a general paths filter — every other
# PR, including workflow-only changes and any PR touching more than the anchor,
# still runs the harness unconditionally. Harness scenario [41] asserts both
# halves of that contract.
#
# workflow_dispatch remains available to rehearse a branch explicitly.
on:
  pull_request:
    paths-ignore:
      - port/upstream.renovate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    name: run_tests.sh (gate + release + watcher fixtures)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: bash -n on every port shell script
        run: |
          set -euo pipefail
          find port -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: py_compile every port python module
        run: |
          set -euo pipefail
          python3 -m py_compile port/prepare_recipe.py port/firefox_sandbox_port.py
      - name: parse every workflow YAML
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys
          try:
              import yaml
          except ImportError:
              print("PyYAML unavailable on runner — structural greps still run in the harness")
              sys.exit(0)
          bad = []
          for p in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  yaml.safe_load(open(p))
              except Exception as e:
                  bad.append(f"{p}: {e}")
          if bad:
              print("\n".join(bad), file=sys.stderr)
              sys.exit(1)
          print(f"YAML parse OK: {len(glob.glob('.github/workflows/*.yml'))} workflows")
          PY
      - name: full harness (stub-GitHub fixtures, zero network)
        run: bash port/tests/run_tests.sh
