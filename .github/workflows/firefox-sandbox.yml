name: Build Termux Firefox with Sandbox

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firefox-sandbox-${{ github.ref }}
  cancel-in-progress: false

env:
  TERMUX_BUILDER_IMAGE_NAME: termux-firefox-builder:sccache

jobs:
  build:
    name: Firefox Sandbox aarch64
    runs-on: ubuntu-26.04
    timeout-minutes: 355

    steps:
      # ============================================================
      # 1. Checkout current upstream Termux packages
      # ============================================================
      - name: Checkout termux-packages
        uses: actions/checkout@v7
        with:
          repository: termux/termux-packages
          ref: master
          fetch-depth: 1

      # ============================================================
      # 2. Verify upstream Firefox recipe
      # ============================================================
      - name: Verify Firefox recipe
        shell: bash
        run: |
          set -euxo pipefail

          FIREFOX_DIR="x11-packages/firefox"
          BUILD_SH="$FIREFOX_DIR/build.sh"
          MOZCONFIG="$FIREFOX_DIR/mozconfig.cfg"

          test -d "$FIREFOX_DIR"
          test -f "$BUILD_SH"
          test -f "$MOZCONFIG"

          echo "======================================"
          echo "Upstream commit"
          echo "======================================"
          git rev-parse HEAD

          echo
          echo "======================================"
          echo "Firefox version"
          echo "======================================"

          grep '^TERMUX_PKG_VERSION=' "$BUILD_SH"
          grep '^TERMUX_PKG_REVISION=' "$BUILD_SH" || true

          echo
          echo "======================================"
          echo "Original Firefox configuration"
          echo "======================================"

          grep -nE 'sandbox|forkserver|ccache' "$MOZCONFIG" || true

          # Fail safely if upstream changes the recipe unexpectedly.
          grep -q '^ac_add_options --disable-sandbox$' "$MOZCONFIG"

      # ============================================================
      # 3. Enable sandbox, disable forkserver, enable sccache
      #
      # forkserver is disabled because Termux/Bionic already gets
      # pthread_atfork from crtbegin_dynamic.o and Mozilla's
      # forkserver interposer caused a duplicate symbol.
      # ============================================================
      - name: Configure Firefox sandbox
        shell: bash
        run: |
          set -euxo pipefail

          MOZCONFIG="x11-packages/firefox/mozconfig.cfg"

          sed -i \
            's/^ac_add_options --disable-sandbox$/ac_add_options --enable-sandbox/' \
            "$MOZCONFIG"

          if ! grep -q '^ac_add_options --disable-forkserver$' "$MOZCONFIG"; then
            echo 'ac_add_options --disable-forkserver' >> "$MOZCONFIG"
          fi

          if ! grep -q '^ac_add_options --with-ccache=sccache$' "$MOZCONFIG"; then
            echo 'ac_add_options --with-ccache=sccache' >> "$MOZCONFIG"
          fi

          echo "======================================"
          echo "Modified mozconfig"
          echo "======================================"

          grep -nE 'sandbox|forkserver|ccache' "$MOZCONFIG"

          grep -q '^ac_add_options --enable-sandbox$' "$MOZCONFIG"
          grep -q '^ac_add_options --disable-forkserver$' "$MOZCONFIG"
          grep -q '^ac_add_options --with-ccache=sccache$' "$MOZCONFIG"

          if grep -q '^ac_add_options --disable-sandbox$' "$MOZCONFIG"; then
            echo "ERROR: --disable-sandbox still present"
            exit 1
          fi

      # ============================================================
      # 4. Modify Termux Firefox package recipe
      #
      # - libandroid-glob runtime/build dependency
      # - -landroid-glob linker flag
      # - API24 cross-link preflight before full Firefox compile
      # - package revision +1
      # ============================================================
      - name: Patch Firefox package recipe
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("x11-packages/firefox/build.sh")
          text = path.read_text()

          # --------------------------------------------------------
          # Add libandroid-glob dependency.
          # --------------------------------------------------------
          m = re.search(
              r'^TERMUX_PKG_DEPENDS="([^"]*)"$',
              text,
              flags=re.MULTILINE,
          )

          if not m:
              raise SystemExit("TERMUX_PKG_DEPENDS not found")

          deps = [x.strip() for x in m.group(1).split(",")]

          if "libandroid-glob" not in deps:
              try:
                  pos = deps.index("libandroid-shmem") + 1
              except ValueError:
                  pos = len(deps)

              deps.insert(pos, "libandroid-glob")

              new_dep_line = (
                  'TERMUX_PKG_DEPENDS="'
                  + ", ".join(deps)
                  + '"'
              )

              text = (
                  text[:m.start()]
                  + new_dep_line
                  + text[m.end():]
              )

          # --------------------------------------------------------
          # Add -landroid-glob to Firefox's target link flags.
          # --------------------------------------------------------
          old_ldflags = (
              'LDFLAGS+=" -landroid-shmem '
              '-landroid-spawn -llog"'
          )

          new_ldflags = (
              'LDFLAGS+=" -landroid-shmem '
              '-landroid-spawn -landroid-glob -llog"'
          )

          if new_ldflags not in text:
              if old_ldflags not in text:
                  raise SystemExit(
                      "Expected Firefox LDFLAGS line not found"
                  )

              text = text.replace(
                  old_ldflags,
                  new_ldflags,
                  1,
              )

          # --------------------------------------------------------
          # Insert source + linker preflight after package patches
          # have been applied and toolchain has been set up.
          #
          # This runs before cargo/cbindgen/Firefox compilation.
          # --------------------------------------------------------
          marker = """termux_step_pre_configure() {
          \ttermux_setup_nodejs
          """

          if marker not in text:
              raise SystemExit(
                  "termux_step_pre_configure marker not found"
              )

          preflight = r'''termux_step_pre_configure() {
          	echo "======================================"
          	echo "Firefox sandbox Termux/Bionic preflight"
          	echo "======================================"

          	# Verify our source compatibility patches were applied.
          	grep -Fq '#include <time.h>' \
          		security/sandbox/linux/reporter/SandboxReporterCommon.h

          	grep -Fq 'BUILDFLAG(IS_FUCHSIA) || defined(__TERMUX__)' \
          		security/sandbox/chromium/base/synchronization/lock_impl_posix.cc

          	grep -Fq 'RunGlibcLazyInitializers' \
          		security/sandbox/linux/Sandbox.cpp

          	grep -Fq '/data/data/com.termux/files/usr/lib' \
          		security/sandbox/linux/broker/SandboxBrokerPolicyFactory.cpp

          	grep -Fq '/data/data/com.termux/files/usr/etc' \
          		security/sandbox/linux/broker/SandboxBrokerPolicyFactory.cpp

          	grep -Fq '/data/data/com.termux/files/usr/share' \
          		security/sandbox/linux/broker/SandboxBrokerPolicyFactory.cpp

          	echo
          	echo "Source patch verification: SUCCESS"

          	# libandroid-glob must be present after dependency setup.
          	if [[ ! -e "$TERMUX_PREFIX/lib/libandroid-glob.so" && \
          	      ! -e "$TERMUX_PREFIX/lib/libandroid-glob.a" ]]; then
          		echo "ERROR: libandroid-glob is not installed"
          		exit 1
          	fi

          	echo
          	echo "libandroid-glob:"
          	ls -l \
          		"$TERMUX_PREFIX/lib/libandroid-glob.so" \
          		"$TERMUX_PREFIX/lib/libandroid-glob.a" \
          		2>/dev/null || true

          	# ------------------------------------------------------
          	# Real aarch64 Android target link test.
          	#
          	# This catches the exact class of error that previously
          	# appeared only after ~80 minutes at libxul.so.
          	# ------------------------------------------------------
          	local _glob_src
          	local _glob_so

          	_glob_src="$TERMUX_PKG_TMPDIR/firefox-sandbox-glob-preflight.c"
          	_glob_so="$TERMUX_PKG_TMPDIR/libfirefox-sandbox-glob-preflight.so"

          	cat > "$_glob_src" <<'EOF'
          #include <glob.h>

          int firefox_termux_glob_preflight(void) {
              glob_t g = {0};

              int result = glob(
                  "/__termux_firefox_sandbox_preflight_no_match__",
                  GLOB_NOSORT,
                  0,
                  &g
              );

              if (result == 0) {
                  globfree(&g);
              }

              return result;
          }
          EOF

          	echo
          	echo "======================================"
          	echo "API24 glob/globfree target link test"
          	echo "======================================"

          	"$CC" \
          		-shared \
          		-fPIC \
          		"$_glob_src" \
          		-I"$TERMUX_PREFIX/include" \
          		-L"$TERMUX_PREFIX/lib" \
          		-Wl,--no-undefined \
          		-landroid-glob \
          		-o "$_glob_so"

          	echo
          	echo "Target link test: SUCCESS"

          	"$READELF" -d "$_glob_so" || true

          	echo
          	echo "======================================"
          	echo "Known Bionic-risk sandbox references"
          	echo "======================================"

          	grep -RInE \
          		'shm_open|glob\(|globfree|pthread_mutexattr_setprotocol|pthread_atfork' \
          		security/sandbox/linux \
          		security/sandbox/chromium/base/synchronization \
          		mozglue/interposers \
          		2>/dev/null \
          		| head -n 120 || true

          	echo
          	echo "Firefox sandbox preflight: SUCCESS"

          	termux_setup_nodejs
          '''

          text = text.replace(
              marker,
              preflight,
              1,
          )

          # --------------------------------------------------------
          # Bump package revision above official Termux version.
          # --------------------------------------------------------
          revision = re.search(
              r"^TERMUX_PKG_REVISION=(\d+)\s*$",
              text,
              flags=re.MULTILINE,
          )

          if revision:
              old_revision = int(revision.group(1))
              new_revision = old_revision + 1

              text = (
                  text[:revision.start()]
                  + f"TERMUX_PKG_REVISION={new_revision}"
                  + text[revision.end():]
              )

          else:
              version = re.search(
                  r"^TERMUX_PKG_VERSION=.*$",
                  text,
                  flags=re.MULTILINE,
              )

              if not version:
                  raise SystemExit(
                      "TERMUX_PKG_VERSION not found"
                  )

              text = (
                  text[:version.end()]
                  + "\nTERMUX_PKG_REVISION=1"
                  + text[version.end():]
              )

          path.write_text(text)
          PY

          echo "======================================"
          echo "Modified build.sh"
          echo "======================================"

          grep '^TERMUX_PKG_VERSION=' \
            x11-packages/firefox/build.sh

          grep '^TERMUX_PKG_REVISION=' \
            x11-packages/firefox/build.sh

          grep '^TERMUX_PKG_DEPENDS=' \
            x11-packages/firefox/build.sh

          grep -n 'LDFLAGS+=' \
            x11-packages/firefox/build.sh

          grep -n \
            'Firefox sandbox Termux/Bionic preflight' \
            x11-packages/firefox/build.sh

      # ============================================================
      # 5. Mozilla/Termux sandbox compatibility patch
      #
      # Fix 1:
      #   <time.h> for timespec
      #
      # Fix 2:
      #   disable priority inheritance pthread path on Termux
      #
      # Fix 3:
      #   skip glibc shm_open lazy init
      #
      # Fix 4:
      #   add Termux prefix read-only paths to sandbox broker
      #
      # Fix 5:
      #   skip desktop Linux ld.so.conf parsing on Termux
      # ============================================================
      - name: Add Termux sandbox compatibility patch
        shell: bash
        run: |
          set -euxo pipefail

          PATCH="x11-packages/firefox/9999-termux-sandbox-compat.patch"

          cat > "$PATCH" <<'PATCH'
          --- a/security/sandbox/linux/reporter/SandboxReporterCommon.h
          +++ b/security/sandbox/linux/reporter/SandboxReporterCommon.h
          @@ -6,6 +6,7 @@
           #ifndef mozilla_SandboxReporterCommon_h
           #define mozilla_SandboxReporterCommon_h

          +#include <time.h>
           #include <sys/types.h>

           #include "mozilla/IntegerTypeTraits.h"

          --- a/security/sandbox/chromium/base/synchronization/lock_impl_posix.cc
          +++ b/security/sandbox/chromium/base/synchronization/lock_impl_posix.cc
          @@ -99,7 +99,7 @@
           // Lock::PriorityInheritanceAvailable still must be checked as the code may
           // compile but the underlying platform still may not correctly support priority
           // inheritance locks.
          -#if BUILDFLAG(IS_FUCHSIA)
          +#if BUILDFLAG(IS_FUCHSIA) || defined(__TERMUX__)
           #define PRIORITY_INHERITANCE_LOCKS_POSSIBLE() 0
           #else
           #define PRIORITY_INHERITANCE_LOCKS_POSSIBLE() 1

          --- a/security/sandbox/linux/Sandbox.cpp
          +++ b/security/sandbox/linux/Sandbox.cpp
          @@ -558,6 +558,7 @@
             }
           }

          +#if !defined(__TERMUX__)
           static void RunGlibcLazyInitializers() {
             // Make glibc's lazy initialization of shm_open() run before sandboxing
             int fd = shm_open("/dummy", O_RDONLY, 0);
          @@ -566,6 +567,7 @@
               close(fd);  // In the unlikely case we actually opened something
             }
           }
          +#endif

           static void SandboxLateInit() {
           #ifdef NIGHTLY_BUILD
          @@ -585,7 +587,9 @@
             }
           #endif

          +#if !defined(__TERMUX__)
             RunGlibcLazyInitializers();
          +#endif

             // This will run on main thread before  it is in a signal-handler context, to
             // make sure rprofiler pointers are properly initialized (and send a marker

          --- a/security/sandbox/linux/broker/SandboxBrokerPolicyFactory.cpp
          +++ b/security/sandbox/linux/broker/SandboxBrokerPolicyFactory.cpp
          @@ -500,6 +500,14 @@
             policy->AddTree(rdonly, "/etc");
             policy->AddTree(rdonly, "/usr/share");
             policy->AddTree(rdonly, "/usr/local/share");
          +
          +#if defined(__TERMUX__)
          +  // Termux uses an Android app-private prefix instead of
          +  // the traditional desktop Linux filesystem layout.
          +  policy->AddTree(rdonly, "/data/data/com.termux/files/usr/lib");
          +  policy->AddTree(rdonly, "/data/data/com.termux/files/usr/etc");
          +  policy->AddTree(rdonly, "/data/data/com.termux/files/usr/share");
          +#endif
             // Various places where fonts reside
             policy->AddTree(rdonly, "/usr/X11R6/lib/X11/fonts");
             policy->AddTree(rdonly, "/nix/store");
          @@ -516,7 +524,9 @@
             policy->AddPath(rdonly, "/usr");
             policy->AddPath(rdonly, "/nix");

          +#if !defined(__TERMUX__)
             AddLdconfigPaths(policy);
          +#endif
             AddLdLibraryEnvPaths(policy);

             if (!headless) {
          PATCH

          git add -N "$PATCH"

          echo "======================================"
          echo "Sandbox compatibility patch"
          echo "======================================"

          cat "$PATCH"

      # ============================================================
      # 6. Fast recipe-level preflight
      #
      # This runs before Docker/Firefox source build.
      # ============================================================
      - name: Recipe preflight
        shell: bash
        run: |
          set -euxo pipefail

          BUILD_SH="x11-packages/firefox/build.sh"
          MOZCONFIG="x11-packages/firefox/mozconfig.cfg"
          PATCH="x11-packages/firefox/9999-termux-sandbox-compat.patch"

          echo "======================================"
          echo "Firefox recipe preflight"
          echo "======================================"

          grep -q '^ac_add_options --enable-sandbox$' "$MOZCONFIG"
          grep -q '^ac_add_options --disable-forkserver$' "$MOZCONFIG"
          grep -q '^ac_add_options --with-ccache=sccache$' "$MOZCONFIG"

          grep '^TERMUX_PKG_DEPENDS=' "$BUILD_SH" \
            | grep -q 'libandroid-glob'

          grep -q -- '-landroid-glob' "$BUILD_SH"

          grep -q 'SandboxReporterCommon.h' "$PATCH"
          grep -q 'lock_impl_posix.cc' "$PATCH"
          grep -q 'RunGlibcLazyInitializers' "$PATCH"
          grep -q 'SandboxBrokerPolicyFactory.cpp' "$PATCH"

          grep -q '/data/data/com.termux/files/usr/lib' "$PATCH"
          grep -q '/data/data/com.termux/files/usr/etc' "$PATCH"
          grep -q '/data/data/com.termux/files/usr/share' "$PATCH"

          git diff --check

          echo
          echo "Recipe preflight: SUCCESS"

      # ============================================================
      # 7. Save modification diff
      # ============================================================
      - name: Save custom changes
        shell: bash
        run: |
          set -euxo pipefail

          git diff -- x11-packages/firefox/ \
            | tee firefox-sandbox-changes.diff

          echo
          echo "======================================"
          echo "Git status"
          echo "======================================"

          git status --short x11-packages/firefox/

      # ============================================================
      # 8. Restore compiler cache
      #
      # restore/save are separate so failed Firefox builds still
      # preserve the objects compiled during that run.
      # ============================================================
      - name: Restore Firefox sccache
        id: sccache-restore
        uses: actions/cache/restore@v4
        with:
          path: .sccache
          key: firefox-sccache-aarch64-v6-${{ github.run_id }}
          restore-keys: |
            firefox-sccache-aarch64-v6-

      # ============================================================
      # 9. Prepare host cache
      # ============================================================
      - name: Prepare sccache directory
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p .sccache

          sudo chown -R \
            "$(id -u):$(id -g)" \
            .sccache

          chmod -R a+rwX .sccache

          echo "======================================"
          echo "Host sccache"
          echo "======================================"

          ls -ld .sccache
          du -sh .sccache || true

      # ============================================================
      # 10. Enable zram
      # ============================================================
      - name: Enable zram
        uses: ./.github/actions/zram
        with:
          algorithm: zstd
          size: 16G
          priority: 100
          device_name: /dev/zram0

      # ============================================================
      # 11. Pull official Termux builder
      #
      # Retry GHCR. If unavailable, build official builder locally.
      # ============================================================
      - name: Prepare official Termux builder
        shell: bash
        run: |
          set -euo pipefail

          BASE_IMAGE="ghcr.io/termux/package-builder:latest"
          PULLED=0

          for attempt in 1 2 3 4 5; do
            echo
            echo "======================================"
            echo "Base image pull ${attempt}/5"
            echo "======================================"

            if docker pull "$BASE_IMAGE"; then
              PULLED=1
              break
            fi

            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 15))

              echo "Pull failed."
              echo "Retrying in ${delay}s..."

              sleep "$delay"
            fi
          done

          if [ "$PULLED" -ne 1 ]; then
            echo
            echo "======================================"
            echo "GHCR unavailable"
            echo "Building official Termux builder"
            echo "======================================"

            docker build \
              -t "$BASE_IMAGE" \
              scripts/

            docker buildx prune -af || true
          fi

          docker image inspect \
            "$BASE_IMAGE" \
            --format \
            'ID={{.Id}} Size={{.Size}} Created={{.Created}}'

      # ============================================================
      # 12. Derive builder image with sccache installed
      #
      # Do this before restricted AppArmor is loaded.
      # ============================================================
      - name: Build Firefox builder with sccache
        shell: bash
        run: |
          set -euxo pipefail

          cat > /tmp/Dockerfile.firefox-sccache <<'DOCKERFILE'
          FROM ghcr.io/termux/package-builder:latest

          USER root

          RUN apt-get update \
              && apt-get install \
                   -yq \
                   --no-install-recommends \
                   sccache \
              && apt-get clean \
              && rm -rf /var/lib/apt/lists/*

          USER builder:builder

          WORKDIR /home/builder/termux-packages
          DOCKERFILE

          docker build \
            -f /tmp/Dockerfile.firefox-sccache \
            -t "$TERMUX_BUILDER_IMAGE_NAME" \
            .

          echo
          echo "======================================"
          echo "Derived builder"
          echo "======================================"

          docker image inspect \
            "$TERMUX_BUILDER_IMAGE_NAME" \
            --format \
            'ID={{.Id}} Size={{.Size}} Created={{.Created}}'

      # ============================================================
      # 13. Create Termux builder container
      #
      # Host compiler cache is mounted outside the repository tree
      # because Termux's restricted AppArmor prevents writes to most
      # of /home/builder/termux-packages.
      # ============================================================
      - name: Start Termux builder
        shell: bash
        run: |
          set -euxo pipefail

          docker rm -f \
            termux-package-builder \
            2>/dev/null || true

          export TERMUX_DOCKER_RUN_EXTRA_ARGS="--volume ${GITHUB_WORKSPACE}/.sccache:/home/builder/.cache/sccache"

          ./scripts/run-docker.sh true

          echo
          echo "======================================"
          echo "Containers"
          echo "======================================"

          docker ps -a

          echo
          echo "======================================"
          echo "Container mounts"
          echo "======================================"

          docker inspect \
            termux-package-builder \
            --format \
            '{{range .Mounts}}{{println .Source "->" .Destination}}{{end}}'

      # ============================================================
      # 14. Verify sccache binary + writable cache
      # ============================================================
      - name: Verify sccache
        shell: bash
        run: |
          set -euxo pipefail

          ./scripts/run-docker.sh bash -lc '
            set -euxo pipefail

            export SCCACHE_DIR=/home/builder/.cache/sccache
            export SCCACHE_CACHE_SIZE=6G

            echo "======================================"
            echo "Builder identity"
            echo "======================================"

            id

            echo
            echo "======================================"
            echo "sccache"
            echo "======================================"

            command -v sccache
            sccache --version

            echo
            echo "======================================"
            echo "Cache directory"
            echo "======================================"

            ls -ld "$SCCACHE_DIR"

            touch "$SCCACHE_DIR/.write-test"
            echo test > "$SCCACHE_DIR/.write-test"
            cat "$SCCACHE_DIR/.write-test"
            rm "$SCCACHE_DIR/.write-test"

            echo
            echo "Cache write test: SUCCESS"
          '

      # ============================================================
      # 15. Work around current ubuntu-26.04 free-space issue
      # ============================================================
      - name: Patch Termux free-space script
        shell: bash
        run: |
          set -euxo pipefail

          SCRIPT="scripts/free-space.sh"

          grep -n 'ruby3.2-doc' "$SCRIPT" || true

          sed -i \
            '/ruby3\.2-doc/d' \
            "$SCRIPT"

          if grep -q 'ruby3.2-doc' "$SCRIPT"; then
            echo "ERROR: ruby3.2-doc still present"
            exit 1
          fi

          echo "ruby3.2-doc removed."

      # ============================================================
      # 16. Free GitHub runner disk space
      # ============================================================
      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "Disk before cleanup"
          echo "======================================"

          df -h

          ./scripts/free-space.sh

          echo
          echo "======================================"
          echo "Disk after cleanup"
          echo "======================================"

          df -h

      # ============================================================
      # 17. Reset sccache stats
      # ============================================================
      - name: Reset sccache statistics
        shell: bash
        run: |
          set -euxo pipefail

          ./scripts/run-docker.sh \
            env \
              SCCACHE_DIR=/home/builder/.cache/sccache \
              SCCACHE_CACHE_SIZE=6G \
            sccache --zero-stats

      # ============================================================
      # 18. Build Firefox
      #
      # The injected termux_step_pre_configure() first performs:
      #
      # - source patch checks
      # - libandroid-glob presence check
      # - real Android aarch64 glob/globfree link test
      #
      # before Firefox's huge build begins.
      # ============================================================
      - name: Build Firefox
        id: build-firefox
        shell: bash
        run: |
          set -o pipefail

          echo "======================================"
          echo "Starting Firefox sandbox build"
          echo "======================================"

          ./scripts/run-docker.sh \
            env \
              SCCACHE_DIR=/home/builder/.cache/sccache \
              SCCACHE_CACHE_SIZE=6G \
            ./build-package.sh \
              -f \
              -I \
              -a aarch64 \
              firefox \
            2>&1 | tee firefox-build.log

      # ============================================================
      # 19. Show sccache stats even on failure
      # ============================================================
      - name: Show sccache statistics
        if: always()
        shell: bash
        run: |
          ./scripts/run-docker.sh \
            env \
              SCCACHE_DIR=/home/builder/.cache/sccache \
              SCCACHE_CACHE_SIZE=6G \
            sccache --show-stats || true

      # ============================================================
      # 20. Diagnostics
      # ============================================================
      - name: Build diagnostics
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "Firefox modifications"
          echo "======================================"

          git diff -- x11-packages/firefox/ || true

          echo
          echo "======================================"
          echo "Disk"
          echo "======================================"

          df -h || true

          echo
          echo "======================================"
          echo "Docker"
          echo "======================================"

          docker ps -a || true

          echo
          echo "======================================"
          echo "sccache size"
          echo "======================================"

          du -sh .sccache \
            2>/dev/null || true

          echo
          echo "======================================"
          echo "Sandbox/preflight markers"
          echo "======================================"

          grep -nE \
            'preflight|security/sandbox|libmozsandbox|libxul|glob|globfree|pthread_atfork|pthread_mutexattr_setprotocol|shm_open|undefined symbol|duplicate symbol|ld\.lld: error' \
            firefox-build.log \
            2>/dev/null \
            | tail -n 200 || true

          echo
          echo "======================================"
          echo "Generated DEB files"
          echo "======================================"

          find output \
            -type f \
            -name 'firefox_*.deb' \
            -print \
            2>/dev/null || true

          echo
          echo "======================================"
          echo "Last 400 Firefox build lines"
          echo "======================================"

          tail -n 400 \
            firefox-build.log \
            2>/dev/null || true

      # ============================================================
      # 21. Save sccache regardless of Firefox success/failure
      # ============================================================
      - name: Save Firefox sccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .sccache
          key: firefox-sccache-aarch64-v6-${{ github.run_id }}

      # ============================================================
      # 22. Collect successful Firefox package
      # ============================================================
      - name: Collect Firefox package
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          find output \
            -type f \
            -name 'firefox_*.deb' \
            -print \
            -exec cp -v '{}' artifacts/ ';'

          cp \
            firefox-sandbox-changes.diff \
            artifacts/

          cp \
            x11-packages/firefox/9999-termux-sandbox-compat.patch \
            artifacts/

          DEB="$(
            find artifacts \
              -maxdepth 1 \
              -type f \
              -name 'firefox_*.deb' \
              -print -quit
          )"

          if [ -z "$DEB" ]; then
            echo "ERROR: Firefox .deb not found"
            exit 1
          fi

          (
            cd artifacts

            sha256sum \
              firefox_*.deb \
              > SHA256SUMS
          )

          echo
          echo "======================================"
          echo "Final Firefox artifacts"
          echo "======================================"

          ls -lh artifacts/

      # ============================================================
      # 23. Upload successful package
      # ============================================================
      - name: Upload Firefox sandbox package
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: firefox-sandbox-aarch64
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # ============================================================
      # 24. Always preserve diagnostics
      # ============================================================
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: firefox-sandbox-build-diagnostics
          path: |
            firefox-build.log
            firefox-sandbox-changes.diff
            x11-packages/firefox/9999-termux-sandbox-compat.patch
          if-no-files-found: ignore
          retention-days: 14
