      # ============================================================
      - name: Recipe preflight
        shell: bash
        run: |
          set -euxo pipefail

          BUILD_SH="x11-packages/firefox/build.sh"
          MOZCONFIG="x11-packages/firefox/mozconfig.cfg"
          PATCH="x11-packages/firefox/9999-termux-native-sandbox.patch"

          # --------------------------------------------------------
          # mozconfig
          # --------------------------------------------------------
          grep -q \
            '^ac_add_options --enable-sandbox$' \
            "$MOZCONFIG"

          grep -q \
            '^ac_add_options --disable-forkserver$' \
            "$MOZCONFIG"

          grep -q \
            '^ac_add_options --with-ccache=sccache$' \
            "$MOZCONFIG"

          # --------------------------------------------------------
          # dependencies
          # --------------------------------------------------------
          grep \
            '^TERMUX_PKG_DEPENDS=' \
            "$BUILD_SH" \
            | grep -q \
              'libandroid-glob'

          grep -q \
            -- '-landroid-glob' \
            "$BUILD_SH"

          # --------------------------------------------------------
          # static patch
          # --------------------------------------------------------
          grep -q \
            'SandboxReporterCommon.h' \
            "$PATCH"

          grep -q \
            'SandboxBrokerPolicyFactory.cpp' \
            "$PATCH"

          grep -q \
            'SandboxFilter.cpp' \
            "$PATCH"

          grep -q \
            '@TERMUX_PREFIX@/tmp' \
            "$PATCH"

          grep -q \
            '/system/fonts' \
            "$PATCH"

          grep -q \
            'PR_PAC_RESET_KEYS' \
            "$PATCH"

          grep -q \
            'PR_GET_DUMPABLE' \
            "$PATCH"

          grep -q \
            'MREMAP_MAYMOVE | MREMAP_FIXED' \
            "$PATCH"

          grep -q \
            '#if !defined(ANDROID) || defined(__TERMUX__)' \
            "$PATCH"

          grep -q \
            '#if defined(ANDROID) && !defined(__TERMUX__)' \
            "$PATCH"

          # --------------------------------------------------------
          # Dynamic injector source validation
          #
          # Do not search for final generated C++ as one literal
          # string here: Python adjacent string literals are joined
          # only when the injector runs.
          # --------------------------------------------------------
          python3 - "$BUILD_SH" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          required = [
              # PAC injector
              "SocketProcessSandboxPolicy",
              "UtilitySandboxPolicy",
              "def inject_prctl_rules(",
              ".Case(PR_GET_DUMPABLE, ",
              ".Case(PR_PAC_RESET_KEYS,",
              "If(arg2 == PR_PAC_APIAKEY, ",
              ".Else(InvalidSyscall()))",

              # PAC final-result verifier
              "def verify_prctl(",
              "PR_GET_DUMPABLE",
              "PR_PAC_RESET_KEYS",
              "PR_PAC_APIAKEY",

              # RLIMIT injector
              "#include <sys/resource.h>",
              "RLIMIT_STACK target probe: SUCCESS",
              "def inject_common_getrlimit_stack():",
              "case __NR_getrlimit:",
              "Arg<int> resource(0);",
              "resource == RLIMIT_STACK",
              "SandboxPolicyBase::",
              "EvaluateSyscall(sysno)",

              # RLIMIT final-result verifier
              "def verify_common_getrlimit():",
              "broad_allow = (",

              # final build-time marker
              "Firefox native sandbox preflight v2.3.1: SUCCESS",
          ]

          missing = [
              token
              for token in required
              if token not in text
          ]

          if missing:
              print(
                  "ERROR: dynamic injector source "
                  "validation failed"
              )

              for token in missing:
                  print(
                      f"  missing: {token!r}"
                  )

              raise SystemExit(1)

          # --------------------------------------------------------
          # Isolate PAC rule generator.
          # --------------------------------------------------------
          start = text.find(
              "def inject_prctl_rules("
          )

          if start < 0:
              raise SystemExit(
                  "ERROR: inject_prctl_rules "
                  "definition not found"
              )

          end = text.find(
              "\n\n          inject_prctl_rules(",
              start,
          )

          if end < 0:
              raise SystemExit(
                  "ERROR: inject_prctl_rules "
                  "generator boundary not found"
              )

          injector = text[start:end]

          # v2.1 regression must never return.
          for bad in (
              ".CASES((PR_GET_DUMPABLE",
              ".CASES((PR_PAC_RESET_KEYS",
          ):
              if bad in injector:
                  raise SystemExit(
                      "ERROR: stale invalid PAC API "
                      f"found: {bad}"
                  )

          for token in (
              ".Case(PR_GET_DUMPABLE, ",
              ".Case(PR_PAC_RESET_KEYS,",
          ):
              if token not in injector:
                  raise SystemExit(
                      "ERROR: valid PAC generator "
                      f"token missing: {token}"
                  )

          # --------------------------------------------------------
          # Isolate RLIMIT_STACK generator.
          # --------------------------------------------------------
          start = text.find(
              "def inject_common_getrlimit_stack():"
          )

          if start < 0:
              raise SystemExit(
                  "ERROR: RLIMIT_STACK injector "
                  "definition not found"
              )

          end = text.find(
              "\n\n          inject_common_getrlimit_stack()",
              start,
          )

          if end < 0:
              raise SystemExit(
                  "ERROR: RLIMIT_STACK injector "
                  "boundary not found"
              )

          rlimit_injector = text[start:end]

          for token in (
              "case __NR_getrlimit:",
              "Arg<int> resource(0);",
              "resource == RLIMIT_STACK",
              "SandboxPolicyBase::",
              "EvaluateSyscall(sysno)",
          ):
              if token not in rlimit_injector:
                  raise SystemExit(
                      "ERROR: RLIMIT_STACK "
                      f"generator token missing: {token}"
                  )

          # Reject a generator that unconditionally allows getrlimit.
          if (
              '"case __NR_getrlimit:\\n"'
              in rlimit_injector
              and
              '"        return Allow();\\n"'
              in rlimit_injector
