      # ============================================================
      # 7. Runtime helper
      # ============================================================
      - name: Create runtime test helper
        shell: bash
        run: |
          set -euxo pipefail

          cat > termux-firefox-native-sandbox-test.sh <<'SCRIPT'
          #!/data/data/com.termux/files/usr/bin/bash

          set -u

          LEVEL="${FIREFOX_SANDBOX_LEVEL:-3}"
          PROFILE="${FIREFOX_SANDBOX_PROFILE:-$HOME/.mozilla/firefox-termux-sandbox-bringup}"
          LOG="${FIREFOX_SANDBOX_LOG:-$HOME/firefox-native-sandbox-runtime.log}"
          DISABLE_AUX="${FIREFOX_SANDBOX_DISABLE_AUX:-0}"

          mkdir -p "$PROFILE"

          cat > "$PROFILE/user.js" <<EOF
          user_pref("security.sandbox.content.level", ${LEVEL});
          user_pref("browser.shell.checkDefaultBrowser", false);
          user_pref("browser.startup.homepage", "about:blank");
          EOF

          echo "======================================"
          echo "Termux Firefox native sandbox v2.3.1"
          echo "======================================"
          echo "level   : $LEVEL"
          echo "profile : $PROFILE"
          echo "log     : $LOG"
          echo "aux off : $DISABLE_AUX"
          echo

          uname -a || true

          getprop \
            ro.build.version.release \
            2>/dev/null || true

          getprop \
            ro.build.version.sdk \
            2>/dev/null || true

          if [ "$DISABLE_AUX" = "1" ]; then

            export \
              MOZ_DISABLE_SOCKET_PROCESS_SANDBOX=1

            export \
              MOZ_DISABLE_UTILITY_SANDBOX=1

            export \
              MOZ_DISABLE_RDD_SANDBOX=1

          else

            unset \
              MOZ_DISABLE_SOCKET_PROCESS_SANDBOX \
              2>/dev/null || true

            unset \
              MOZ_DISABLE_UTILITY_SANDBOX \
              2>/dev/null || true

            unset \
              MOZ_DISABLE_RDD_SANDBOX \
              2>/dev/null || true
          fi

          set +e

          MOZ_SANDBOX_LOGGING=1 \
            firefox \
              --no-remote \
              --profile "$PROFILE" \
              about:blank \
              2>&1 \
            | tee "$LOG"

          rc=${PIPESTATUS[0]}

          set -e

          echo
          echo "======================================"
          echo "Sandbox-focused runtime log"
          echo "======================================"

          grep -nEi \
            'sandbox|seccomp|sigsys|violation|syscall|163|getrlimit|rlimit_stack|prctl|mremap|linker_cfi|shadowwrite|map_failed|org\.mozilla\.ipc|shmsegmentswriter|system/fonts|timezone|tzdata|__properties__|channel error' \
            "$LOG" \
            | tail -n 700 || true

          echo
          echo "Firefox exit code: $rc"

          exit "$rc"
          SCRIPT

          chmod +x \
            termux-firefox-native-sandbox-test.sh

          bash -n \
            termux-firefox-native-sandbox-test.sh

          grep -Fq \
            'PROFILE="${FIREFOX_SANDBOX_PROFILE:-$HOME/.mozilla/firefox-termux-sandbox-bringup}"' \
            termux-firefox-native-sandbox-test.sh

          echo \
            "Runtime helper syntax: SUCCESS"

      # ============================================================
      # 8. Save diff
      # ============================================================
      - name: Save custom changes
        shell: bash
        run: |
          set -euxo pipefail

          git diff -- \
            x11-packages/firefox/ \
            | tee \
