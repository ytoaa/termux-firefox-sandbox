      # ============================================================
      # 9. Restore sccache
      # ============================================================
      - name: Restore Firefox sccache
        id: sccache-restore
        uses: actions/cache/restore@v4
        with:
          path: .sccache
          key: firefox-native-sandbox-sccache-aarch64-v12-${{ github.run_id }}
          restore-keys: |
            firefox-native-sandbox-sccache-aarch64-v12-
            firefox-native-sandbox-sccache-aarch64-v11-
            firefox-native-sandbox-sccache-aarch64-v10-
            firefox-native-sandbox-sccache-aarch64-v9-
            firefox-native-sandbox-sccache-aarch64-v8-
            firefox-native-sandbox-sccache-aarch64-v7-

      # ============================================================
      # 10. Prepare cache
      # ============================================================
      - name: Prepare sccache directory
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p .sccache

          sudo chown -R \
            "$(id -u):$(id -g)" \
            .sccache

          chmod -R \
            a+rwX \
            .sccache

          ls -ld .sccache

          du -sh \
            .sccache || true

      # ============================================================
      # 11. zram
      # ============================================================
      - name: Enable zram
        uses: ./.github/actions/zram
        with:
          algorithm: zstd
          size: 16G
          priority: 100
          device_name: /dev/zram0

      # ============================================================
      # 12. Official Termux builder
      # ============================================================
      - name: Prepare official Termux builder
        shell: bash
        run: |
          set -euo pipefail

          BASE_IMAGE="ghcr.io/termux/package-builder:latest"
          PULLED=0

          for attempt in 1 2 3 4 5; do

            echo
            echo "======================================"
            echo "Base image pull ${attempt}/5"
            echo "======================================"

            if docker pull "$BASE_IMAGE"; then
              PULLED=1
              break
            fi

            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 15))

              echo \
                "Pull failed. Retry in ${delay}s..."

              sleep "$delay"
            fi
          done

          if [ "$PULLED" -ne 1 ]; then

            docker build \
              -t "$BASE_IMAGE" \
              scripts/

            docker buildx prune \
              -af || true
          fi

          docker image inspect \
            "$BASE_IMAGE" \
            --format \
            'ID={{.Id}} Size={{.Size}} Created={{.Created}}'

      # ============================================================
      # 13. Builder + sccache
      # ============================================================
      - name: Build Firefox builder with sccache
        shell: bash
        run: |
          set -euxo pipefail

          cat > /tmp/Dockerfile.firefox-sccache <<'DOCKERFILE'
          FROM ghcr.io/termux/package-builder:latest

          USER root

          RUN apt-get update \
              && apt-get install \
                   -yq \
                   --no-install-recommends \
                   sccache \
              && apt-get clean \
              && rm -rf /var/lib/apt/lists/*

          USER builder:builder

          WORKDIR /home/builder/termux-packages
          DOCKERFILE

          docker build \
            -f /tmp/Dockerfile.firefox-sccache \
            -t "$TERMUX_BUILDER_IMAGE_NAME" \
            .

          docker image inspect \
            "$TERMUX_BUILDER_IMAGE_NAME" \
            --format \
            'ID={{.Id}} Size={{.Size}} Created={{.Created}}'

      # ============================================================
      # 14. Start builder
      # ============================================================
      - name: Start Termux builder
        shell: bash
        run: |
          set -euxo pipefail

          docker rm -f \
            termux-package-builder \
            2>/dev/null || true

          export \
            TERMUX_DOCKER_RUN_EXTRA_ARGS="--volume ${GITHUB_WORKSPACE}/.sccache:/home/builder/.cache/sccache"

          ./scripts/run-docker.sh true

          docker ps -a

          docker inspect \
            termux-package-builder \
            --format \
            '{{range .Mounts}}{{println .Source "->" .Destination}}{{end}}'

      # ============================================================
      # 15. Verify sccache
      # ============================================================
      - name: Verify sccache
        shell: bash
        run: |
          set -euxo pipefail

          ./scripts/run-docker.sh \
            bash -lc '
              set -euxo pipefail

              export SCCACHE_DIR=/home/builder/.cache/sccache
              export SCCACHE_CACHE_SIZE=6G

              id

              command -v sccache
              sccache --version

              ls -ld "$SCCACHE_DIR"

              echo test \
                > "$SCCACHE_DIR/.write-test"

              cat \
                "$SCCACHE_DIR/.write-test"

              rm \
                "$SCCACHE_DIR/.write-test"
            '

      # ============================================================
      # 16. Ubuntu runner cleanup workaround
      # ============================================================
      - name: Patch Termux free-space script
        shell: bash
        run: |
          set -euxo pipefail

          SCRIPT="scripts/free-space.sh"

          sed -i \
            '/ruby3\.2-doc/d' \
            "$SCRIPT"

          if grep -q \
            'ruby3.2-doc' \
            "$SCRIPT"; then

            echo \
              "ERROR: ruby3.2-doc still present"

            exit 1
          fi

      # ============================================================
      # 17. Free disk
      # ============================================================
      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "Disk before cleanup"
          echo "======================================"

          df -h

          ./scripts/free-space.sh

          echo
          echo "======================================"
          echo "Disk after cleanup"
          echo "======================================"

          df -h

      # ============================================================
      # 18. Reset cache statistics
      # ============================================================
      - name: Reset sccache statistics
        shell: bash
        run: |
          set -euxo pipefail

          ./scripts/run-docker.sh \
            env \
              SCCACHE_DIR=/home/builder/.cache/sccache \
              SCCACHE_CACHE_SIZE=6G \
            sccache \
              --zero-stats

      # ============================================================
      # 19. Build Firefox
      # ============================================================
      - name: Build Firefox
        id: build-firefox
        shell: bash
        run: |
          set -o pipefail

          echo "======================================"
          echo "Starting Firefox native sandbox v2.3.1"
          echo "======================================"

          ./scripts/run-docker.sh \
            env \
              SCCACHE_DIR=/home/builder/.cache/sccache \
              SCCACHE_CACHE_SIZE=6G \
            ./build-package.sh \
              -f \
              -I \
              -a aarch64 \
              firefox \
            2>&1 \
            | tee firefox-build.log

      # ============================================================
      # 20. Cache stats
      # ============================================================
      - name: Show sccache statistics
        if: always()
        shell: bash
        run: |
          ./scripts/run-docker.sh \
            env \
              SCCACHE_DIR=/home/builder/.cache/sccache \
              SCCACHE_CACHE_SIZE=6G \
            sccache \
              --show-stats \
            || true

      # ============================================================
      # 21. Diagnostics
      # ============================================================
      - name: Build diagnostics
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "Firefox modifications"
          echo "======================================"

          git diff -- \
            x11-packages/firefox/ \
            || true

          echo
          echo "======================================"
          echo "Patch reject files"
          echo "======================================"

          ./scripts/run-docker.sh \
            bash -lc '
              find \
                /home/builder/.termux-build/firefox \
                -type f \
                -name "*.rej" \
                -print \
                -exec sh -c '"'"'
                  echo
                  echo "---------- $1 ----------"
                  cat "$1"
                '"'"' _ {} \;
            ' \
            2>/dev/null || true

          echo
          echo "======================================"
          echo "Final SandboxFilter compatibility rules"
          echo "======================================"

          ./scripts/run-docker.sh \
            bash -lc '
              SRC=/home/builder/.termux-build/firefox/src/security/sandbox/linux/SandboxFilter.cpp

              if [ -f "$SRC" ]; then
                grep -nE \
                  "PR_PAC_RESET_KEYS|PR_GET_DUMPABLE|__NR_getrlimit|RLIMIT_STACK|MREMAP_FIXED|sys/resource.h" \
                  "$SRC" \
                  || true
              fi
            ' \
            2>/dev/null || true

          echo
          echo "======================================"
          echo "Disk / Docker / cache"
          echo "======================================"

          df -h || true
          docker ps -a || true

          du -sh \
            .sccache \
            2>/dev/null || true

          echo
          echo "======================================"
          echo "Sandbox / Bionic markers"
          echo "======================================"

          grep -nEi \
            'preflight|RLIMIT_STACK|getrlimit|__NR_getrlimit|syntax sanity|SocketProcessSandboxPolicy|UtilitySandboxPolicy|PrctlPolicy injection|security/sandbox|libmozsandbox|libxul|PR_PAC_RESET_KEYS|PR_GET_DUMPABLE|mremap|MREMAP_FIXED|AddSharedMemoryPaths|org\.mozilla\.ipc|system/fonts|shm_open|ShmSegmentsWriter|undefined symbol|duplicate symbol|ld\.lld: error|patch.*FAILED|Hunk.*FAILED|reject' \
            firefox-build.log \
            2>/dev/null \
            | tail -n 700 || true

          echo
          echo "======================================"
          echo "Generated DEB files"
          echo "======================================"

          find output \
            -type f \
            -name 'firefox_*.deb' \
            -print \
            2>/dev/null || true

          echo
          echo "======================================"
          echo "Last 800 build lines"
          echo "======================================"

          tail -n 800 \
            firefox-build.log \
            2>/dev/null || true

      # ============================================================
      # 22. Save cache
      # ============================================================
      - name: Save Firefox sccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .sccache
          key: firefox-native-sandbox-sccache-aarch64-v12-${{ github.run_id }}

      # ============================================================
      # 23. Collect package
      # ============================================================
      - name: Collect Firefox package
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          find output \
            -type f \
            -name 'firefox_*.deb' \
            -print \
            -exec cp -v '{}' artifacts/ ';'

          cp \
            firefox-native-sandbox-changes.diff \
            artifacts/

          cp \
            x11-packages/firefox/9999-termux-native-sandbox.patch \
            artifacts/

          cp \
            termux-firefox-native-sandbox-test.sh \
            artifacts/

          DEB="$(
            find artifacts \
              -maxdepth 1 \
              -type f \
              -name 'firefox_*.deb' \
              -print -quit
          )"

          if [ -z "$DEB" ]; then
            echo "ERROR: Firefox .deb not found"
            exit 1
          fi

          (
            cd artifacts

            sha256sum \
              firefox_*.deb \
              > SHA256SUMS
          )

          echo
          echo "======================================"
          echo "Final artifacts"
          echo "======================================"

          ls -lh artifacts/

      # ============================================================
      # 24. Upload package
      # ============================================================
      - name: Upload Firefox native sandbox package
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: firefox-native-sandbox-aarch64-v2.3.1
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # ============================================================
      # 25. Upload diagnostics
      # ============================================================
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: firefox-native-sandbox-build-diagnostics-v2.3.1
          path: |
            firefox-build.log
            firefox-native-sandbox-changes.diff
            x11-packages/firefox/9999-termux-native-sandbox.patch
            termux-firefox-native-sandbox-test.sh
          if-no-files-found: ignore
          retention-days: 14
