name: Build Termux Firefox Native Sandbox Port v2.3.1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firefox-native-sandbox-${{ github.ref }}
  cancel-in-progress: false

env:
  TERMUX_BUILDER_IMAGE_NAME: termux-firefox-builder:sccache

jobs:
  build:
    name: Firefox native sandbox aarch64
    runs-on: ubuntu-26.04
    timeout-minutes: 355

    steps:
      # ============================================================
      # 1. Checkout current upstream Termux packages
      # ============================================================
      - name: Checkout termux-packages
        uses: actions/checkout@v7
        with:
          repository: termux/termux-packages
          ref: master
          fetch-depth: 1

      # ============================================================
      # 2. Verify exact upstream Firefox recipe/version
      # ============================================================
      - name: Verify upstream Firefox recipe
        shell: bash
        run: |
          set -euxo pipefail

          FIREFOX_DIR="x11-packages/firefox"
          BUILD_SH="$FIREFOX_DIR/build.sh"
          MOZCONFIG="$FIREFOX_DIR/mozconfig.cfg"
          EXPECTED_FIREFOX_VERSION="155.0.1"

          test -d "$FIREFOX_DIR"
          test -f "$BUILD_SH"
          test -f "$MOZCONFIG"

          echo "======================================"
          echo "Upstream termux-packages commit"
          echo "======================================"
          git rev-parse HEAD

          echo
          echo "======================================"
          echo "Firefox package version"
          echo "======================================"

          grep '^TERMUX_PKG_VERSION=' "$BUILD_SH"
          grep '^TERMUX_PKG_REVISION=' "$BUILD_SH" || true

          if ! grep -q \
            "^TERMUX_PKG_VERSION=\"$EXPECTED_FIREFOX_VERSION\"$" \
            "$BUILD_SH"; then

            echo
            echo "ERROR: Unsupported Firefox version."
            echo "Expected: $EXPECTED_FIREFOX_VERSION"
            echo
            echo "The native sandbox patch must be reviewed"
            echo "before using it with a newer Firefox source."
            exit 1
          fi

          echo
          echo "Firefox version guard: SUCCESS"

          echo
          echo "======================================"
          echo "Original sandbox configuration"
          echo "======================================"

          grep -nE \
            'sandbox|forkserver|ccache|jemalloc|hardening' \
            "$MOZCONFIG" || true

          grep -q \
            '^ac_add_options --disable-sandbox$' \
            "$MOZCONFIG"

      # ============================================================
      # 3. Enable Firefox native sandbox
      # ============================================================
      - name: Configure native sandbox build
        shell: bash
        run: |
          set -euxo pipefail

          MOZCONFIG="x11-packages/firefox/mozconfig.cfg"

          sed -i \
            's/^ac_add_options --disable-sandbox$/ac_add_options --enable-sandbox/' \
            "$MOZCONFIG"

          grep -q \
            '^ac_add_options --disable-forkserver$' \
            "$MOZCONFIG" || \
            echo \
              'ac_add_options --disable-forkserver' \
              >> "$MOZCONFIG"

          grep -q \
            '^ac_add_options --with-ccache=sccache$' \
            "$MOZCONFIG" || \
            echo \
              'ac_add_options --with-ccache=sccache' \
              >> "$MOZCONFIG"

          grep -q \
            '^ac_add_options --enable-sandbox$' \
            "$MOZCONFIG"

          grep -q \
            '^ac_add_options --disable-forkserver$' \
            "$MOZCONFIG"

          grep -q \
            '^ac_add_options --with-ccache=sccache$' \
            "$MOZCONFIG"

          if grep -q \
            '^ac_add_options --disable-sandbox$' \
            "$MOZCONFIG"; then

            echo "ERROR: --disable-sandbox is still present"
            exit 1
          fi

          echo "======================================"
          echo "Modified mozconfig"
          echo "======================================"

          cat "$MOZCONFIG"

      # ============================================================
      # 4. Patch Firefox package recipe
      #
      # Dynamic post-patch source injection:
      #
      # - Socket / Utility PR_PAC_RESET_KEYS
      # - Common getrlimit(RLIMIT_STACK)
      #
      # Runs after all normal Termux patches and our 9999 patch.
      # ============================================================
      - name: Patch Firefox package recipe
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("x11-packages/firefox/build.sh")
          text = path.read_text()

          # --------------------------------------------------------
          # libandroid-glob dependency
          # --------------------------------------------------------
          m = re.search(
              r'^TERMUX_PKG_DEPENDS="([^"]*)"$',
              text,
              flags=re.MULTILINE,
          )

          if not m:
              raise SystemExit(
                  "TERMUX_PKG_DEPENDS not found"
              )

          deps = [
              x.strip()
              for x in m.group(1).split(",")
          ]

          if "libandroid-glob" not in deps:
              try:
                  pos = (
                      deps.index("libandroid-shmem")
                      + 1
                  )
              except ValueError:
                  pos = len(deps)

              deps.insert(
                  pos,
                  "libandroid-glob",
              )

              new_line = (
                  'TERMUX_PKG_DEPENDS="'
                  + ", ".join(deps)
                  + '"'
              )

              text = (
                  text[:m.start()]
                  + new_line
                  + text[m.end():]
              )

          # --------------------------------------------------------
          # libandroid-glob linker dependency
          # --------------------------------------------------------
          old_ldflags = (
              'LDFLAGS+=" -landroid-shmem '
              '-landroid-spawn -llog"'
          )

          new_ldflags = (
              'LDFLAGS+=" -landroid-shmem '
              '-landroid-spawn '
              '-landroid-glob -llog"'
          )

          if new_ldflags not in text:
              if old_ldflags not in text:
                  raise SystemExit(
                      "Expected Firefox LDFLAGS "
                      "line not found"
                  )

              text = text.replace(
                  old_ldflags,
                  new_ldflags,
                  1,
              )

          marker = (
              "termux_step_pre_configure() {\n"
              "\ttermux_setup_nodejs\n"
          )

          if marker not in text:
              raise SystemExit(
                  "termux_step_pre_configure "
                  "marker not found"
              )

          preflight = r'''termux_step_pre_configure() {
          \techo "======================================"
          \techo "Firefox native sandbox Termux/Bionic preflight v2.3.1"
          \techo "======================================"

          \tlocal _macro_src
          \tlocal _macro_obj

          \t_macro_src="$TERMUX_PKG_TMPDIR/firefox-termux-macros.c"
          \t_macro_obj="$TERMUX_PKG_TMPDIR/firefox-termux-macros.o"

          \tcat > "$_macro_src" <<'EOF'
          #include <sys/cdefs.h>

          #ifndef __TERMUX__
          #error "__TERMUX__ is not defined"
          #endif

          #ifndef __ANDROID__
          #error "__ANDROID__ is not defined"
          #endif

          int firefox_termux_macro_probe(void) {
              return 0;
          }
          EOF

          \t"$CC" \
          \t\t-c \
          \t\t"$_macro_src" \
          \t\t-o "$_macro_obj"

          \techo
          \techo "Target macro probe: SUCCESS"

          # --------------------------------------------------------
          # Verify Android/Bionic RLIMIT_STACK constant.
          # --------------------------------------------------------
          \tlocal _rlimit_src
          \tlocal _rlimit_obj

          \t_rlimit_src="$TERMUX_PKG_TMPDIR/firefox-termux-rlimit.cc"
          \t_rlimit_obj="$TERMUX_PKG_TMPDIR/firefox-termux-rlimit.o"

          \tcat > "$_rlimit_src" <<'EOF'
          #include <sys/resource.h>

          static_assert(
              RLIMIT_STACK == 3,
              "Unexpected Android RLIMIT_STACK value"
          );

          int firefox_termux_rlimit_probe(void) {
              return RLIMIT_STACK;
          }
          EOF

          \t"$CXX" \
          \t\t-c \
          \t\t"$_rlimit_src" \
          \t\t-o "$_rlimit_obj"

          \techo "RLIMIT_STACK target probe: SUCCESS"

          # ========================================================
          # SandboxFilter.cpp dynamic compatibility injection
          # ========================================================
          \tpython3 <<'PY2'
          from pathlib import Path

          path = Path(
              "security/sandbox/linux/"
              "SandboxFilter.cpp"
          )

          text = path.read_text()


          # ========================================================
          # Shared helper: class boundaries
          # ========================================================
          def class_bounds(
              source,
              class_name,
              next_class=None,
          ):
              start = source.find(
                  f"class {class_name}"
              )

              if start < 0:
                  raise SystemExit(
                      f"{class_name}: "
                      "class not found"
                  )

              if next_class:
                  end = source.find(
                      f"class {next_class}",
                      start + 1,
                  )

                  if end < 0:
                      raise SystemExit(
                          f"{class_name}: "
                          f"next class {next_class} "
                          "not found"
                      )
              else:
                  end = len(source)

              return start, end


          # ========================================================
          # RLIMIT_STACK declaration
          # ========================================================
          if "#include <sys/resource.h>" not in text:
              include_marker = (
                  "#include <sys/prctl.h>\n"
              )

              if include_marker not in text:
                  raise SystemExit(
                      "sys/prctl.h include marker "
                      "not found"
                  )

              text = text.replace(
                  include_marker,
                  include_marker
                  + "#include <sys/resource.h>\n",
                  1,
              )

              print(
                  "sys/resource.h include injected"
              )


          # ========================================================
          # Socket / Utility PRCTL compatibility
          # ========================================================
          def prctl_bounds(
              source,
              class_name,
              next_class=None,
          ):
              start, end = class_bounds(
                  source,
                  class_name,
                  next_class,
              )

              segment = source[start:end]

              marker = (
                  "ResultExpr PrctlPolicy() "
                  "const override {"
              )

              p = segment.find(marker)

              if p < 0:
                  raise SystemExit(
                      f"{class_name}: "
                      "PrctlPolicy not found"
                  )

              q = segment.find(
                  "ResultExpr EvaluateSyscall",
                  p,
              )

              if q < 0:
                  raise SystemExit(
                      f"{class_name}: "
                      "EvaluateSyscall boundary "
                      "not found"
                  )

              return (
                  start,
                  end,
                  p,
                  q,
                  segment[p:q],
              )


          def inject_prctl_rules(
              class_name,
              next_class=None,
          ):
              global text

              start, end, p, q, prctl = \
                  prctl_bounds(
                      text,
                      class_name,
                      next_class,
                  )

              need_dumpable = (
                  "PR_GET_DUMPABLE"
                  not in prctl
              )

              need_pac = (
                  "PR_PAC_RESET_KEYS"
                  not in prctl
              )

              if (
                  not need_dumpable
                  and not need_pac
              ):
                  print(
                      f"{class_name}: "
                      "Termux PAC rules "
                      "already present"
                  )
                  return

              segment = text[start:end]

              switch_pos = segment.find(
                  "return Switch(op)",
                  p,
                  q,
              )

              if switch_pos < 0:
                  raise SystemExit(
                      f"{class_name}: "
                      "return Switch(op) "
                      "not found"
                  )

              newline = segment.find(
                  "\n",
                  switch_pos,
              )

              if newline < 0:
                  raise SystemExit(
                      f"{class_name}: "
                      "malformed Switch(op)"
                  )

              insert_at = (
                  start
                  + newline
                  + 1
              )

              rules = [
                  "#if defined(__TERMUX__)\n"
              ]

              if need_dumpable:
                  rules.append(
                      "        "
                      ".Case(PR_GET_DUMPABLE, "
                      "Allow())\n"
                  )

              if need_pac:
                  rules.extend([
                      "#  if defined(__aarch64__)\n",

                      "        "
                      ".Case(PR_PAC_RESET_KEYS,\n",

                      "              "
                      "If(arg2 == PR_PAC_APIAKEY, "
                      "Allow())\n",

                      "                  "
                      ".Else(InvalidSyscall()))\n",

                      "#  endif\n",
                  ])

              rules.append(
                  "#endif\n"
              )

              text = (
                  text[:insert_at]
                  + "".join(rules)
                  + text[insert_at:]
              )

              print(
                  f"{class_name}: "
                  "Termux PAC rules injected"
              )


          inject_prctl_rules(
              "SocketProcessSandboxPolicy",
              "UtilitySandboxPolicy",
          )

          inject_prctl_rules(
              "UtilitySandboxPolicy",
          )


          # ========================================================
          # Common getrlimit(RLIMIT_STACK)
          #
          # Observed runtime:
          #
          # syscall 163 = getrlimit
          # arg0 3      = RLIMIT_STACK
          #
          # Only RLIMIT_STACK is permitted.
          # ========================================================
          def inject_common_getrlimit_stack():
              global text

              common_start, common_end = \
                  class_bounds(
                      text,
                      "SandboxPolicyCommon",
                      "ContentSandboxPolicy",
                  )

              segment = text[
                  common_start:common_end
              ]

              function_marker = (
                  "ResultExpr EvaluateSyscall("
                  "int sysno) const override {"
              )

              function_start = segment.find(
                  function_marker
              )

              if function_start < 0:
                  raise SystemExit(
                      "SandboxPolicyCommon: "
                      "EvaluateSyscall not found"
                  )

              function_text = segment[
                  function_start:
              ]

              if (
                  "resource == RLIMIT_STACK"
                  in function_text
              ):
                  print(
                      "SandboxPolicyCommon: "
                      "RLIMIT_STACK rule "
                      "already present"
                  )
                  return

              time_marker = segment.find(
                  "// Timekeeping",
                  function_start,
              )

              if time_marker < 0:
                  raise SystemExit(
                      "SandboxPolicyCommon: "
                      "Timekeeping marker "
                      "not found"
                  )

              # The final common switch(sysno) is immediately before
              # the Timekeeping section.
              switch_pos = segment.rfind(
                  "switch (sysno) {",
                  function_start,
                  time_marker,
              )

              if switch_pos < 0:
                  raise SystemExit(
                      "SandboxPolicyCommon: "
                      "main switch(sysno) "
                      "not found"
                  )

              newline = segment.find(
                  "\n",
                  switch_pos,
              )

              if newline < 0:
                  raise SystemExit(
                      "SandboxPolicyCommon: "
                      "malformed main switch"
                  )

              insert_at = (
                  common_start
                  + newline
                  + 1
              )

              rule = (
                  "#if defined(__TERMUX__) && "
                  "defined(__NR_getrlimit)\n"
                  "      case __NR_getrlimit: {\n"
                  "        Arg<int> resource(0);\n"
                  "        return If("
                  "resource == RLIMIT_STACK, "
                  "Allow())\n"
                  "            .Else("
                  "SandboxPolicyBase::"
                  "EvaluateSyscall(sysno));\n"
                  "      }\n"
                  "#endif\n"
                  "\n"
              )

              text = (
                  text[:insert_at]
                  + rule
                  + text[insert_at:]
              )

              print(
                  "SandboxPolicyCommon: "
                  "RLIMIT_STACK rule injected"
              )


          inject_common_getrlimit_stack()

          path.write_text(text)

          result = path.read_text()


          # ========================================================
          # Verify Socket / Utility PRCTL rules
          # ========================================================
          def verify_prctl(
              class_name,
              next_class=None,
          ):
              _, _, _, _, prctl = \
                  prctl_bounds(
                      result,
                      class_name,
                      next_class,
                  )

              bad_patterns = (
                  ".CASES(("
                  + "PR_GET_DUMPABLE)",

                  ".CASES(("
                  + "PR_PAC_RESET_KEYS)",
              )

              for bad in bad_patterns:
                  if bad in prctl:
                      raise SystemExit(
                          f"{class_name}: "
                          "invalid injected API: "
                          f"{bad}"
                      )

              required = (
                  ".Case("
                  "PR_GET_DUMPABLE, Allow())",

                  ".Case("
                  "PR_PAC_RESET_KEYS,",

                  "arg2 == PR_PAC_APIAKEY",
              )

              for token in required:
                  if token not in prctl:
                      raise SystemExit(
                          f"{class_name}: "
                          "expected rule missing: "
                          f"{token}"
                      )

              print(
                  f"{class_name}: "
                  "PrctlPolicy syntax sanity "
                  "SUCCESS"
              )


          verify_prctl(
              "SocketProcessSandboxPolicy",
              "UtilitySandboxPolicy",
          )

          verify_prctl(
              "UtilitySandboxPolicy",
          )


          # ========================================================
          # Verify Common RLIMIT_STACK policy
          # ========================================================
          def verify_common_getrlimit():
              common_start, common_end = \
                  class_bounds(
                      result,
                      "SandboxPolicyCommon",
                      "ContentSandboxPolicy",
                  )

              common = result[
                  common_start:common_end
              ]

              required_global = (
                  "#include <sys/resource.h>",
              )

              for token in required_global:
                  if token not in result:
                      raise SystemExit(
                          "Common RLIMIT_STACK: "
                          "expected global token missing: "
                          f"{token}"
                      )

              required_common = (
                  "#if defined(__TERMUX__) "
                  "&& defined(__NR_getrlimit)",

                  "case __NR_getrlimit:",

                  "Arg<int> resource(0);",

                  "resource == RLIMIT_STACK",

                  ".Else("
                  "SandboxPolicyBase::"
                  "EvaluateSyscall(sysno))",
              )

              for token in required_common:
                  if token not in common:
                      raise SystemExit(
                          "Common RLIMIT_STACK: "
                          "expected policy token missing: "
                          f"{token}"
                      )

              count = common.count(
                  "case __NR_getrlimit:"
              )

              if count != 1:
                  raise SystemExit(
                      "Common RLIMIT_STACK: "
                      "expected exactly one "
                      "__NR_getrlimit case, "
                      f"found {count}"
                  )

              broad_allow = (
                  "case __NR_getrlimit:\n"
                  "        return Allow();"
              )

              if broad_allow in common:
                  raise SystemExit(
                      "Common RLIMIT_STACK: "
                      "broad getrlimit Allow() "
                      "detected"
                  )

              print(
                  "SandboxPolicyCommon: "
                  "getrlimit(RLIMIT_STACK) "
                  "syntax sanity SUCCESS"
              )


          verify_common_getrlimit()

          print(
              "Socket/Utility PrctlPolicy "
              "injection: SUCCESS"
          )

          print(
              "Common RLIMIT_STACK "
              "injection: SUCCESS"
          )
          PY2

          # ========================================================
          # Existing compatibility verification
          # ========================================================
          \tgrep -Fq \
          \t\t'#include <time.h>' \
          \t\tsecurity/sandbox/linux/reporter/SandboxReporterCommon.h

          \tgrep -Fq \
          \t\t'BUILDFLAG(IS_FUCHSIA) || defined(__TERMUX__)' \
          \t\tsecurity/sandbox/chromium/base/synchronization/lock_impl_posix.cc

          \tgrep -Fq \
          \t\t'RunGlibcLazyInitializers' \
          \t\tsecurity/sandbox/linux/Sandbox.cpp

          \tgrep -Fq \
          \t\t"$TERMUX_PREFIX/lib" \
          \t\tsecurity/sandbox/linux/broker/SandboxBrokerPolicyFactory.cpp

          \tgrep -Fq \
          \t\t"$TERMUX_PREFIX/etc" \
          \t\tsecurity/sandbox/linux/broker/SandboxBrokerPolicyFactory.cpp

          \tgrep -Fq \
          \t\t"$TERMUX_PREFIX/share" \
          \t\tsecurity/sandbox/linux/broker/SandboxBrokerPolicyFactory.cpp

          \tgrep -Fq \
          \t\t'#if !defined(ANDROID) || defined(__TERMUX__)' \
          \t\tsecurity/sandbox/linux/SandboxFilter.cpp

          \tgrep -Fq \
          \t\t'#if defined(ANDROID) && !defined(__TERMUX__)' \
          \t\tsecurity/sandbox/linux/SandboxFilter.cpp

          \tgrep -Fq \
          \t\t'PR_PAC_RESET_KEYS' \
          \t\tsecurity/sandbox/linux/SandboxFilter.cpp

          \tgrep -Fq \
          \t\t'PR_GET_DUMPABLE' \
          \t\tsecurity/sandbox/linux/SandboxFilter.cpp

          \tgrep -Fq \
          \t\t'MREMAP_MAYMOVE | MREMAP_FIXED' \
          \t\tsecurity/sandbox/linux/SandboxFilter.cpp

          # ========================================================
          # v2.3.1 RLIMIT_STACK verification
          # ========================================================
          \tgrep -Fq \
          \t\t'#include <sys/resource.h>' \
          \t\tsecurity/sandbox/linux/SandboxFilter.cpp

          \tgrep -Fq \
          \t\t'case __NR_getrlimit:' \
          \t\tsecurity/sandbox/linux/SandboxFilter.cpp

          \tgrep -Fq \
          \t\t'resource == RLIMIT_STACK' \
          \t\tsecurity/sandbox/linux/SandboxFilter.cpp

          # ========================================================
          # SHM / fonts
          # ========================================================
          \tgrep -Fq \
          \t\t"$TERMUX_PREFIX/tmp/" \
          \t\tipc/glue/SharedMemoryPlatform_posix.cpp

          \tgrep -Fq \
          \t\t"std::string shmPath(\"$TERMUX_PREFIX/tmp\")" \
          \t\tsecurity/sandbox/linux/broker/SandboxBrokerPolicyFactory.cpp

          \tgrep -Fq \
          \t\t'policy->AddTree(rdonly, "/system/fonts")' \
          \t\tsecurity/sandbox/linux/broker/SandboxBrokerPolicyFactory.cpp

          \techo
          \techo "Sandbox source verification: SUCCESS"

          # ========================================================
          # libandroid-glob
          # ========================================================
          \tif [[ \
          \t\t! -e "$TERMUX_PREFIX/lib/libandroid-glob.so" \
          \t\t&& \
          \t\t! -e "$TERMUX_PREFIX/lib/libandroid-glob.a" \
          \t]]; then

          \t\techo "ERROR: libandroid-glob is not installed"
          \t\texit 1
          \tfi

          \tlocal _glob_src
          \tlocal _glob_so

          \t_glob_src="$TERMUX_PKG_TMPDIR/firefox-sandbox-glob-preflight.c"
          \t_glob_so="$TERMUX_PKG_TMPDIR/libfirefox-sandbox-glob-preflight.so"

          \tcat > "$_glob_src" <<'EOF'
          #include <glob.h>

          int firefox_termux_glob_preflight(void) {
              glob_t g = {0};

              int result = glob(
                  "/__termux_firefox_sandbox_preflight_no_match__",
                  GLOB_NOSORT,
                  0,
                  &g
              );

              if (result == 0) {
                  globfree(&g);
              }

              return result;
          }
          EOF

          \t"$CC" \
          \t\t-shared \
          \t\t-fPIC \
          \t\t"$_glob_src" \
          \t\t-I"$TERMUX_PREFIX/include" \
          \t\t-L"$TERMUX_PREFIX/lib" \
          \t\t-Wl,--no-undefined \
          \t\t-landroid-glob \
          \t\t-o "$_glob_so"

          \techo
          \techo "API24 glob/globfree target link test: SUCCESS"

          \t"$READELF" \
          \t\t-d "$_glob_so" || true

          \techo
          \techo "======================================"
          \techo "Known sandbox/Bionic references"
          \techo "======================================"

          \tgrep -RInE \
          \t\t'PR_PAC_RESET_KEYS|PR_GET_DUMPABLE|__NR_getrlimit|RLIMIT_STACK|mremap|MREMAP_FIXED|getrlimit|AddSharedMemoryPaths|org\.mozilla\.ipc|system/fonts|shm_open|glob\(|globfree|pthread_mutexattr_setprotocol|pthread_atfork' \
          \t\tsecurity/sandbox/linux \
          \t\tsecurity/sandbox/chromium/base/synchronization \
          \t\tipc/glue \
          \t\tmozglue/interposers \
          \t\t2>/dev/null \
          \t\t| head -n 350 || true

          \techo
          \techo "Firefox native sandbox preflight v2.3.1: SUCCESS"

          \ttermux_setup_nodejs
          '''

          preflight = preflight.replace(
              r"\t",
              "\t",
          )

          text = text.replace(
              marker,
              preflight,
              1,
          )

          # --------------------------------------------------------
          # Package revision +1
          # --------------------------------------------------------
          revision = re.search(
              r"^TERMUX_PKG_REVISION=(\d+)\s*$",
              text,
              flags=re.MULTILINE,
          )

          if revision:
              new_revision = (
                  int(revision.group(1))
                  + 1
              )

              text = (
                  text[:revision.start()]
