name: Build Termux Firefox Native Sandbox Port v2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firefox-native-sandbox-${{ github.ref }}
  cancel-in-progress: false

env:
  TERMUX_BUILDER_IMAGE_NAME: termux-firefox-builder:sccache

jobs:
  build:
    name: Firefox native sandbox aarch64
    runs-on: ubuntu-26.04
    timeout-minutes: 355

    steps:
      - name: Checkout termux-packages
        uses: actions/checkout@v7
        with:
          repository: termux/termux-packages
          ref: master
          fetch-depth: 1

      - name: Verify upstream Firefox recipe
        shell: bash
        run: |
          set -euxo pipefail

          FIREFOX_DIR="x11-packages/firefox"
          BUILD_SH="$FIREFOX_DIR/build.sh"
          MOZCONFIG="$FIREFOX_DIR/mozconfig.cfg"

          test -d "$FIREFOX_DIR"
          test -f "$BUILD_SH"
          test -f "$MOZCONFIG"

          echo "======================================"
          echo "Upstream termux-packages commit"
          echo "======================================"
          git rev-parse HEAD

          echo
          echo "======================================"
          echo "Firefox package version"
          echo "======================================"
          grep '^TERMUX_PKG_VERSION=' "$BUILD_SH"
          grep '^TERMUX_PKG_REVISION=' "$BUILD_SH" || true

          echo
          echo "======================================"
          echo "Original sandbox configuration"
          echo "======================================"
          grep -nE 'sandbox|forkserver|ccache|jemalloc|hardening' "$MOZCONFIG" || true

          grep -q '^ac_add_options --disable-sandbox$' "$MOZCONFIG"

      - name: Configure native sandbox build
        shell: bash
        run: |
          set -euxo pipefail

          MOZCONFIG="x11-packages/firefox/mozconfig.cfg"

          sed -i \
            's/^ac_add_options --disable-sandbox$/ac_add_options --enable-sandbox/' \
            "$MOZCONFIG"

          grep -q '^ac_add_options --disable-forkserver$' "$MOZCONFIG" || \
            echo 'ac_add_options --disable-forkserver' >> "$MOZCONFIG"

          grep -q '^ac_add_options --with-ccache=sccache$' "$MOZCONFIG" || \
            echo 'ac_add_options --with-ccache=sccache' >> "$MOZCONFIG"

          grep -q '^ac_add_options --enable-sandbox$' "$MOZCONFIG"
          grep -q '^ac_add_options --disable-forkserver$' "$MOZCONFIG"
          grep -q '^ac_add_options --with-ccache=sccache$' "$MOZCONFIG"

          ! grep -q '^ac_add_options --disable-sandbox$' "$MOZCONFIG"

          cat "$MOZCONFIG"

      - name: Patch Firefox package recipe
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("x11-packages/firefox/build.sh")
          text = path.read_text()

          m = re.search(
              r'^TERMUX_PKG_DEPENDS="([^"]*)"$',
              text,
              flags=re.MULTILINE,
          )

          if not m:
              raise SystemExit("TERMUX_PKG_DEPENDS not found")

          deps = [x.strip() for x in m.group(1).split(",")]

          if "libandroid-glob" not in deps:
              try:
                  pos = deps.index("libandroid-shmem") + 1
              except ValueError:
                  pos = len(deps)

              deps.insert(pos, "libandroid-glob")

              new_line = (
                  'TERMUX_PKG_DEPENDS="'
                  + ", ".join(deps)
                  + '"'
              )

              text = (
                  text[:m.start()]
                  + new_line
                  + text[m.end():]
              )

          old_ldflags = (
              'LDFLAGS+=" -landroid-shmem '
              '-landroid-spawn -llog"'
          )

          new_ldflags = (
              'LDFLAGS+=" -landroid-shmem '
              '-landroid-spawn -landroid-glob -llog"'
          )

          if new_ldflags not in text:
              if old_ldflags not in text:
                  raise SystemExit(
                      "Expected Firefox LDFLAGS line not found"
                  )

              text = text.replace(
                  old_ldflags,
                  new_ldflags,
                  1,
              )

          marker = (
              "termux_step_pre_configure() {\n"
              "\ttermux_setup_nodejs\n"
          )

          if marker not in text:
              raise SystemExit(
                  "termux_step_pre_configure marker not found"
              )

          preflight = r'''termux_step_pre_configure() {
          \techo "======================================"
          \techo "Firefox native sandbox Termux/Bionic preflight v2"
          \techo "======================================"

          \tlocal _macro_src
          \tlocal _macro_obj

          \t_macro_src="$TERMUX_PKG_TMPDIR/firefox-termux-macros.c"
          \t_macro_obj="$TERMUX_PKG_TMPDIR/firefox-termux-macros.o"

          \tcat > "$_macro_src" <<'EOF'
          #include <sys/cdefs.h>

          #ifndef __TERMUX__
          #error "__TERMUX__ is not defined"
          #endif

          #ifndef __ANDROID__
          #error "__ANDROID__ is not defined"
          #endif

          int firefox_termux_macro_probe(void) {
              return 0;
          }
          EOF

          \t"$CC" \
          \t\t-c \
          \t\t"$_macro_src" \
          \t\t-o "$_macro_obj"

          \techo "Target macro probe: SUCCESS"

          # --------------------------------------------------------
          # Existing sandbox compatibility patches.
          # --------------------------------------------------------
          \tgrep -Fq '#include <time.h>' \
          \t\tsecurity/sandbox/linux/reporter/SandboxReporterCommon.h

          \tgrep -Fq 'BUILDFLAG(IS_FUCHSIA) || defined(__TERMUX__)' \
          \t\tsecurity/sandbox/chromium/base/synchronization/lock_impl_posix.cc

          \tgrep -Fq 'RunGlibcLazyInitializers' \
          \t\tsecurity/sandbox/linux/Sandbox.cpp

          \tgrep -Fq "$TERMUX_PREFIX/lib" \
          \t\tsecurity/sandbox/linux/broker/SandboxBrokerPolicyFactory.cpp

          \tgrep -Fq "$TERMUX_PREFIX/etc" \
          \t\tsecurity/sandbox/linux/broker/SandboxBrokerPolicyFactory.cpp

          \tgrep -Fq "$TERMUX_PREFIX/share" \
          \t\tsecurity/sandbox/linux/broker/SandboxBrokerPolicyFactory.cpp

          \tgrep -Fq '#if !defined(ANDROID) || defined(__TERMUX__)' \
          \t\tsecurity/sandbox/linux/SandboxFilter.cpp

          \tgrep -Fq 'MREMAP_MAYMOVE | MREMAP_FIXED' \
          \t\tsecurity/sandbox/linux/SandboxFilter.cpp

          \tgrep -Fq '#if defined(ANDROID) && !defined(__TERMUX__)' \
          \t\tsecurity/sandbox/linux/SandboxFilter.cpp

          # --------------------------------------------------------
          # v2:
          #
          # Termux's existing Firefox POSIX-shm patch maps shm_open()
          # names to $TERMUX_PREFIX/tmp/<name>.
          #
          # Firefox's broker therefore has to authorize that exact
          # physical path instead of desktop Linux /dev/shm.
          # --------------------------------------------------------
          \tgrep -Fq "$TERMUX_PREFIX/tmp/" \
          \t\tipc/glue/SharedMemoryPlatform_posix.cpp

          \tgrep -Fq "std::string shmPath(\"$TERMUX_PREFIX/tmp\")" \
          \t\tsecurity/sandbox/linux/broker/SandboxBrokerPolicyFactory.cpp

          # Android system fonts are used by the Termux GTK build.
          \tgrep -Fq 'policy->AddTree(rdonly, "/system/fonts")' \
          \t\tsecurity/sandbox/linux/broker/SandboxBrokerPolicyFactory.cpp

          # --------------------------------------------------------
          # Verify PAC permission exists in the process-specific
          # Socket and Utility policies, not merely in Common.
          # --------------------------------------------------------
          \tpython3 <<'PY2'
          from pathlib import Path

          p = Path(
              "security/sandbox/linux/SandboxFilter.cpp"
          )

          s = p.read_text()

          if s.count("PR_PAC_RESET_KEYS") < 4:
              raise SystemExit(
                  "PR_PAC_RESET_KEYS is not present "
                  "in all required policy sections"
              )

          def class_segment(name, next_name=None):
              marker = f"class {name}"

              if marker not in s:
                  raise SystemExit(
                      f"{name} not found"
                  )

              part = s.split(marker, 1)[1]

              if next_name:
                  end = f"class {next_name}"

                  if end in part:
                      part = part.split(
                          end,
                          1,
                      )[0]

              return part

          socket = class_segment(
              "SocketProcessSandboxPolicy",
              "UtilitySandboxPolicy",
          )

          utility = class_segment(
              "UtilitySandboxPolicy"
          )

          for name, segment in (
              (
                  "SocketProcessSandboxPolicy",
                  socket,
              ),
              (
                  "UtilitySandboxPolicy",
                  utility,
              ),
          ):
              if "PR_PAC_RESET_KEYS" not in segment:
                  raise SystemExit(
                      f"{name}: "
                      "PR_PAC_RESET_KEYS rule missing"
                  )

              if "PR_GET_DUMPABLE" not in segment:
                  raise SystemExit(
                      f"{name}: "
                      "PR_GET_DUMPABLE rule missing"
                  )

          print(
              "Socket/Utility PAC policy verification: "
              "SUCCESS"
          )
          PY2

          \techo "Sandbox source patch verification: SUCCESS"

          # --------------------------------------------------------
          # libandroid-glob.
          # --------------------------------------------------------
          \tif [[ ! -e "$TERMUX_PREFIX/lib/libandroid-glob.so" && \
          \t      ! -e "$TERMUX_PREFIX/lib/libandroid-glob.a" ]]; then
          \t\techo "ERROR: libandroid-glob is not installed"
          \t\texit 1
          \tfi

          \tlocal _glob_src
          \tlocal _glob_so

          \t_glob_src="$TERMUX_PKG_TMPDIR/firefox-sandbox-glob-preflight.c"
          \t_glob_so="$TERMUX_PKG_TMPDIR/libfirefox-sandbox-glob-preflight.so"

          \tcat > "$_glob_src" <<'EOF'
          #include <glob.h>

          int firefox_termux_glob_preflight(void) {
              glob_t g = {0};

              int result = glob(
                  "/__termux_firefox_sandbox_preflight_no_match__",
                  GLOB_NOSORT,
                  0,
                  &g
              );

              if (result == 0) {
                  globfree(&g);
              }

              return result;
          }
          EOF

          \t"$CC" \
          \t\t-shared \
          \t\t-fPIC \
          \t\t"$_glob_src" \
          \t\t-I"$TERMUX_PREFIX/include" \
          \t\t-L"$TERMUX_PREFIX/lib" \
          \t\t-Wl,--no-undefined \
          \t\t-landroid-glob \
          \t\t-o "$_glob_so"

          \techo "API24 glob/globfree target link test: SUCCESS"

          \t"$READELF" \
          \t\t-d "$_glob_so" || true

          \techo
          \techo "======================================"
          \techo "Known sandbox/Bionic references"
          \techo "======================================"

          \tgrep -RInE \
          \t\t'PR_PAC_RESET_KEYS|PR_GET_DUMPABLE|mremap|MREMAP_FIXED|getrlimit|AddSharedMemoryPaths|org\.mozilla\.ipc|system/fonts|shm_open|glob\(|globfree|pthread_mutexattr_setprotocol|pthread_atfork' \
          \t\tsecurity/sandbox/linux \
          \t\tsecurity/sandbox/chromium/base/synchronization \
          \t\tipc/glue \
          \t\tmozglue/interposers \
          \t\t2>/dev/null \
          \t\t| head -n 260 || true

          \techo
          \techo "Firefox native sandbox preflight v2: SUCCESS"

          \ttermux_setup_nodejs
          '''

          # Keep '\' characters in the raw Python string while
          # converting our explicit \t markers to real shell tabs.
          preflight = preflight.replace(
              r"\t",
              "\t",
          )

          text = text.replace(
              marker,
              preflight,
              1,
          )

          # --------------------------------------------------------
          # Package revision +1.
          # --------------------------------------------------------
          revision = re.search(
              r"^TERMUX_PKG_REVISION=(\d+)\s*$",
              text,
              flags=re.MULTILINE,
          )

          if revision:
              new_revision = (
                  int(revision.group(1))
                  + 1
              )

              text = (
                  text[:revision.start()]
                  + f"TERMUX_PKG_REVISION={new_revision}"
                  + text[revision.end():]
              )

          else:
              version = re.search(
                  r"^TERMUX_PKG_VERSION=.*$",
                  text,
                  flags=re.MULTILINE,
              )

              if not version:
                  raise SystemExit(
                      "TERMUX_PKG_VERSION not found"
                  )

              text = (
                  text[:version.end()]
                  + "\nTERMUX_PKG_REVISION=1"
                  + text[version.end():]
              )

          path.write_text(text)
          PY

          echo "======================================"
          echo "Modified build.sh"
          echo "======================================"

          grep '^TERMUX_PKG_VERSION=' \
            x11-packages/firefox/build.sh

          grep '^TERMUX_PKG_REVISION=' \
            x11-packages/firefox/build.sh

          grep '^TERMUX_PKG_DEPENDS=' \
            x11-packages/firefox/build.sh

          grep -n 'LDFLAGS+=' \
            x11-packages/firefox/build.sh

          grep -n \
            'native sandbox Termux/Bionic preflight v2' \
            x11-packages/firefox/build.sh

      - name: Add Termux native sandbox port patch v2
        shell: bash
        run: |
          set -euxo pipefail

          PATCH="x11-packages/firefox/9999-termux-native-sandbox.patch"

          cat > "$PATCH" <<'PATCH'
          --- a/security/sandbox/linux/reporter/SandboxReporterCommon.h
          +++ b/security/sandbox/linux/reporter/SandboxReporterCommon.h
          @@ -5,7 +5,8 @@
           #ifndef mozilla_SandboxReporterCommon_h
           #define mozilla_SandboxReporterCommon_h

          +#include <time.h>
           #include <sys/types.h>

           #include "mozilla/IntegerTypeTraits.h"

          --- a/security/sandbox/chromium/base/synchronization/lock_impl_posix.cc
          +++ b/security/sandbox/chromium/base/synchronization/lock_impl_posix.cc
          @@ -92,8 +92,8 @@
           // Lock::PriorityInheritanceAvailable still must be checked as the code may
           // compile but the underlying platform still may not correctly support priority
           // inheritance locks.
          -#if BUILDFLAG(IS_FUCHSIA)
          +#if BUILDFLAG(IS_FUCHSIA) || defined(__TERMUX__)
           #define PRIORITY_INHERITANCE_LOCKS_POSSIBLE() 0
           #else
           #define PRIORITY_INHERITANCE_LOCKS_POSSIBLE() 1

          --- a/security/sandbox/linux/Sandbox.cpp
          +++ b/security/sandbox/linux/Sandbox.cpp
          @@ -560,12 +560,14 @@
             }
           }

          +#if !defined(__TERMUX__)
           static void RunGlibcLazyInitializers() {
             // Make glibc's lazy initialization of shm_open() run before sandboxing
             int fd = shm_open("/dummy", O_RDONLY, 0);
             if (fd > 0) {
               close(fd);  // In the unlikely case we actually opened something
             }
           }
          +#endif

           static void SandboxLateInit() {
          @@ -587,7 +589,9 @@
               }
             }

          +#if !defined(__TERMUX__)
             RunGlibcLazyInitializers();
          +#endif

             // This will run on main thread before  it is in a signal-handler context, to

          --- a/security/sandbox/linux/broker/SandboxBrokerPolicyFactory.cpp
          +++ b/security/sandbox/linux/broker/SandboxBrokerPolicyFactory.cpp
          @@ -319,7 +319,11 @@

           static void AddSharedMemoryPaths(SandboxBroker::Policy* aPolicy, pid_t aPid) {
          +#if defined(__TERMUX__)
          +  std::string shmPath("@TERMUX_PREFIX@/tmp");
          +#else
             std::string shmPath("/dev/shm");
          +#endif
             if (ipc::shared_memory::AppendPosixShmPrefix(&shmPath, aPid)) {
               aPolicy->AddPrefix(rdwrcr, shmPath.c_str());
             }
           }
          @@ -500,6 +504,13 @@
             policy->AddTree(rdonly, "/etc");
             policy->AddTree(rdonly, "/usr/share");
             policy->AddTree(rdonly, "/usr/local/share");
          +
          +#if defined(__TERMUX__)
          +  policy->AddTree(rdonly, "@TERMUX_PREFIX@/lib");
          +  policy->AddTree(rdonly, "@TERMUX_PREFIX@/etc");
          +  policy->AddTree(rdonly, "@TERMUX_PREFIX@/share");
          +  policy->AddTree(rdonly, "/system/fonts");
          +#endif
             // Various places where fonts reside
             policy->AddTree(rdonly, "/usr/X11R6/lib/X11/fonts");
             policy->AddTree(rdonly, "/nix/store");
          @@ -516,8 +527,10 @@
             policy->AddPath(rdonly, "/usr");
             policy->AddPath(rdonly, "/nix");

          +#if !defined(__TERMUX__)
             AddLdconfigPaths(policy);
          +#endif
             AddLdLibraryEnvPaths(policy);

             if (!headless) {

          --- a/security/sandbox/linux/SandboxFilter.cpp
          +++ b/security/sandbox/linux/SandboxFilter.cpp
          @@ -80,6 +80,15 @@
           #ifndef PR_SET_VMA_ANON_NAME
           #  define PR_SET_VMA_ANON_NAME 0
           #endif
          +
          +#if defined(__TERMUX__) && defined(__aarch64__)
          +#  ifndef PR_PAC_RESET_KEYS
          +#    define PR_PAC_RESET_KEYS 54
          +#  endif
          +#  ifndef PR_PAC_APIAKEY
          +#    define PR_PAC_APIAKEY (1UL << 0)
          +#  endif
          +#endif

           // The GNU libc headers define O_LARGEFILE as 0 on x86_64, but we need the
           // actual value because it shows up in file flags.
          @@ -137,7 +146,7 @@
           #endif

           // To avoid visual confusion between "ifdef ANDROID" and "ifndef ANDROID":
          -#ifndef ANDROID
          +#if !defined(ANDROID) || defined(__TERMUX__)
           #  define DESKTOP
           #endif

          @@ -792,11 +801,18 @@
             virtual ResultExpr PrctlPolicy() const {
               Arg<int> op(0);
               Arg<int> arg2(1);
               return Switch(op)
                   .Case(PR_SET_VMA,  // Tagging of anonymous memory mappings
                         If(arg2 == PR_SET_VMA_ANON_NAME, Allow()).Else(InvalidSyscall()))
          +#if defined(__TERMUX__)
          +        .Case(PR_GET_DUMPABLE, Allow())
          +#  if defined(__aarch64__)
          +        .Case(PR_PAC_RESET_KEYS,
          +              If(arg2 == PR_PAC_APIAKEY, Allow()).Else(InvalidSyscall()))
          +#  endif
          +#endif
                   .Cases({PR_GET_SECCOMP,   // BroadcastSetThreadSandbox, etc.
                           PR_SET_NAME,      // Thread creation
                           PR_SET_DUMPABLE,  // Crash reporting
                           PR_SET_PTRACER},  // Debug-mode crash handling
                          Allow())
          @@ -1177,10 +1193,17 @@
                   return Allow();

                   // Similarly, mremap (bugs: 1047620, 1286119, 1860267)
                 case __NR_mremap: {
                   Arg<int> flags(3);
          +#if defined(__TERMUX__)
          +        return If(flags == 0, Allow())
          +            .ElseIf(flags == MREMAP_MAYMOVE, Allow())
          +            .ElseIf(flags == (MREMAP_MAYMOVE | MREMAP_FIXED), Allow())
          +            .Else(SandboxPolicyBase::EvaluateSyscall(sysno));
          +#else
                   return If((flags & ~MREMAP_MAYMOVE) == 0, Allow())
                       .Else(SandboxPolicyBase::EvaluateSyscall(sysno));
          +#endif
                 }
           #endif

          @@ -1468,7 +1491,7 @@
             Maybe<ResultExpr> EvaluateSocketCall(int aCall,
                                                  bool aHasArgs) const override {
               switch (aCall) {
          -#ifdef ANDROID
          +#if defined(ANDROID) && !defined(__TERMUX__)
                 case SYS_SOCKET:
                   return Some(Error(EACCES));
           #else  // #ifdef DESKTOP
          @@ -2118,10 +2141,17 @@
             ResultExpr PrctlPolicy() const override {
               Arg<int> op(0);
               Arg<int> arg2(1);
               return Switch(op)
                   .CASES((PR_SET_VMA),  // Tagging of anonymous memory mappings
                          If(arg2 == PR_SET_VMA_ANON_NAME, Allow()).Else(InvalidSyscall()))
          +#if defined(__TERMUX__)
          +        .CASES((PR_GET_DUMPABLE), Allow())
          +#  if defined(__aarch64__)
          +        .CASES((PR_PAC_RESET_KEYS),
          +               If(arg2 == PR_PAC_APIAKEY, Allow()).Else(InvalidSyscall()))
          +#  endif
          +#endif
                   .CASES((PR_SET_NAME,      // Thread creation
                           PR_SET_DUMPABLE,  // Crash reporting
                           PR_SET_PTRACER),  // Debug-mode crash handling
                          Allow())
          @@ -2228,10 +2258,17 @@
             ResultExpr PrctlPolicy() const override {
               Arg<int> op(0);
               Arg<int> arg2(1);
               return Switch(op)
                   .CASES((PR_SET_VMA),  // Tagging of anonymous memory mappings
                          If(arg2 == PR_SET_VMA_ANON_NAME, Allow()).Else(InvalidSyscall()))
          +#if defined(__TERMUX__)
          +        .CASES((PR_GET_DUMPABLE), Allow())
          +#  if defined(__aarch64__)
          +        .CASES((PR_PAC_RESET_KEYS),
          +               If(arg2 == PR_PAC_APIAKEY, Allow()).Else(InvalidSyscall()))
          +#  endif
          +#endif
                   .CASES((PR_SET_NAME,        // Thread creation
                           PR_SET_DUMPABLE,    // Crash reporting
                           PR_SET_PTRACER,     // Debug-mode crash handling
                           PR_GET_PDEATHSIG),  // PGO profiling, cf
          PATCH

          git add -N "$PATCH"

          echo "======================================"
          echo "Native sandbox port patch v2"
          echo "======================================"

          cat "$PATCH"

      - name: Recipe preflight
        shell: bash
        run: |
          set -euxo pipefail

          BUILD_SH="x11-packages/firefox/build.sh"
          MOZCONFIG="x11-packages/firefox/mozconfig.cfg"
          PATCH="x11-packages/firefox/9999-termux-native-sandbox.patch"

          grep -q '^ac_add_options --enable-sandbox$' "$MOZCONFIG"
          grep -q '^ac_add_options --disable-forkserver$' "$MOZCONFIG"
          grep -q '^ac_add_options --with-ccache=sccache$' "$MOZCONFIG"

          grep '^TERMUX_PKG_DEPENDS=' "$BUILD_SH" \
            | grep -q 'libandroid-glob'

          grep -q -- \
            '-landroid-glob' \
            "$BUILD_SH"

          grep -q \
            'SandboxReporterCommon.h' \
            "$PATCH"

          grep -q \
            'SandboxBrokerPolicyFactory.cpp' \
            "$PATCH"

          grep -q \
            'SandboxFilter.cpp' \
            "$PATCH"

          grep -q \
            '@TERMUX_PREFIX@/tmp' \
            "$PATCH"

          grep -q \
            '/system/fonts' \
            "$PATCH"

          grep -q \
            'PR_PAC_RESET_KEYS' \
            "$PATCH"

          grep -q \
            'PR_GET_DUMPABLE' \
            "$PATCH"

          grep -q \
            'MREMAP_MAYMOVE | MREMAP_FIXED' \
            "$PATCH"

          test "$(
            grep -c \
              'PR_PAC_RESET_KEYS' \
              "$PATCH"
          )" -ge 4

          grep -q \
            '#if !defined(ANDROID) || defined(__TERMUX__)' \
            "$PATCH"

          grep -q \
            '#if defined(ANDROID) && !defined(__TERMUX__)' \
            "$PATCH"

          # Do not include the generated unified-diff file itself.
          # Valid empty context lines contain a single leading space.
          git diff --check -- \
            x11-packages/firefox/build.sh \
            x11-packages/firefox/mozconfig.cfg

          echo "Recipe preflight: SUCCESS"

      - name: Create runtime test helper
        shell: bash
        run: |
          set -euxo pipefail

          cat > termux-firefox-native-sandbox-test.sh <<'SCRIPT'
          #!/data/data/com.termux/files/usr/bin/bash

          set -u

          LEVEL="${FIREFOX_SANDBOX_LEVEL:-3}"
          PROFILE="${FIREFOX_SANDBOX_PROFILE:-$HOME/.mozilla/firefox-termux-sandbox-bringup}"
          LOG="${FIREFOX_SANDBOX_LOG:-$HOME/firefox-native-sandbox-runtime.log}"

          # v2 default:
          # Test the complete sandbox stack.
          #
          # Set FIREFOX_SANDBOX_DISABLE_AUX=1 only when comparing
          # against Content-only behavior.
          DISABLE_AUX="${FIREFOX_SANDBOX_DISABLE_AUX:-0}"

          mkdir -p "$PROFILE"

          cat > "$PROFILE/user.js" <<EOF
          user_pref("security.sandbox.content.level", ${LEVEL});
          user_pref("browser.shell.checkDefaultBrowser", false);
          user_pref("browser.startup.homepage", "about:blank");
          EOF

          echo "======================================"
          echo "Termux Firefox native sandbox v2"
          echo "======================================"
          echo "level   : $LEVEL"
          echo "profile : $PROFILE"
          echo "log     : $LOG"
          echo "aux off : $DISABLE_AUX"
          echo

          uname -a || true

          getprop \
            ro.build.version.release \
            2>/dev/null || true

          getprop \
            ro.build.version.sdk \
            2>/dev/null || true

          if [ "$DISABLE_AUX" = "1" ]; then
            export MOZ_DISABLE_SOCKET_PROCESS_SANDBOX=1
            export MOZ_DISABLE_UTILITY_SANDBOX=1
            export MOZ_DISABLE_RDD_SANDBOX=1
          else
            unset MOZ_DISABLE_SOCKET_PROCESS_SANDBOX || true
            unset MOZ_DISABLE_UTILITY_SANDBOX || true
            unset MOZ_DISABLE_RDD_SANDBOX || true
          fi

          set +e

          MOZ_SANDBOX_LOGGING=1 \
            firefox \
              --no-remote \
              --profile "$PROFILE" \
              about:blank \
              2>&1 | tee "$LOG"

          rc=${PIPESTATUS[0]}

          set -e

          echo
          echo "======================================"
          echo "Sandbox-focused runtime log"
          echo "======================================"

          grep -nEi \
            'sandbox|seccomp|sigsys|violation|syscall|prctl|getrlimit|mremap|linker_cfi|shadowwrite|map_failed|org\.mozilla\.ipc|shmsegmentswriter|system/fonts|timezone|tzdata|__properties__|channel error' \
            "$LOG" \
            | tail -n 500 || true

          echo
          echo "Firefox exit code: $rc"

          exit "$rc"
          SCRIPT

          chmod +x \
            termux-firefox-native-sandbox-test.sh

      - name: Save custom changes
        shell: bash
        run: |
          set -euxo pipefail

          git diff -- \
            x11-packages/firefox/ \
            | tee firefox-native-sandbox-changes.diff

          git status --short \
            x11-packages/firefox/

      - name: Restore Firefox sccache
        id: sccache-restore
        uses: actions/cache/restore@v4
        with:
          path: .sccache
          key: firefox-native-sandbox-sccache-aarch64-v8-${{ github.run_id }}
          restore-keys: |
            firefox-native-sandbox-sccache-aarch64-v8-
            firefox-native-sandbox-sccache-aarch64-v7-

      - name: Prepare sccache directory
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p .sccache

          sudo chown -R \
            "$(id -u):$(id -g)" \
            .sccache

          chmod -R a+rwX \
            .sccache

          ls -ld .sccache

          du -sh \
            .sccache || true

      - name: Enable zram
        uses: ./.github/actions/zram
        with:
          algorithm: zstd
          size: 16G
          priority: 100
          device_name: /dev/zram0

      - name: Prepare official Termux builder
        shell: bash
        run: |
          set -euo pipefail

          BASE_IMAGE="ghcr.io/termux/package-builder:latest"
          PULLED=0

          for attempt in 1 2 3 4 5; do
            echo "Base image pull ${attempt}/5"

            if docker pull "$BASE_IMAGE"; then
              PULLED=1
              break
            fi

            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 15))
            fi
          done

          if [ "$PULLED" -ne 1 ]; then
            docker build \
              -t "$BASE_IMAGE" \
              scripts/

            docker buildx prune -af || true
          fi

          docker image inspect \
            "$BASE_IMAGE" \
            --format \
            'ID={{.Id}} Size={{.Size}} Created={{.Created}}'

      - name: Build Firefox builder with sccache
        shell: bash
        run: |
          set -euxo pipefail

          cat > /tmp/Dockerfile.firefox-sccache <<'DOCKERFILE'
          FROM ghcr.io/termux/package-builder:latest

          USER root

          RUN apt-get update \
              && apt-get install \
                   -yq \
                   --no-install-recommends \
                   sccache \
              && apt-get clean \
              && rm -rf /var/lib/apt/lists/*

          USER builder:builder

          WORKDIR /home/builder/termux-packages
          DOCKERFILE

          docker build \
            -f /tmp/Dockerfile.firefox-sccache \
            -t "$TERMUX_BUILDER_IMAGE_NAME" \
            .

      - name: Start Termux builder
        shell: bash
        run: |
          set -euxo pipefail

          docker rm -f \
            termux-package-builder \
            2>/dev/null || true

          export TERMUX_DOCKER_RUN_EXTRA_ARGS="--volume ${GITHUB_WORKSPACE}/.sccache:/home/builder/.cache/sccache"

          ./scripts/run-docker.sh true

          docker ps -a

          docker inspect \
            termux-package-builder \
            --format \
            '{{range .Mounts}}{{println .Source "->" .Destination}}{{end}}'

      - name: Verify sccache
        shell: bash
        run: |
          set -euxo pipefail

          ./scripts/run-docker.sh bash -lc '
            set -euxo pipefail

            export SCCACHE_DIR=/home/builder/.cache/sccache
            export SCCACHE_CACHE_SIZE=6G

            id

            command -v sccache
            sccache --version

            ls -ld "$SCCACHE_DIR"

            touch "$SCCACHE_DIR/.write-test"

            echo test \
              > "$SCCACHE_DIR/.write-test"

            cat \
              "$SCCACHE_DIR/.write-test"

            rm \
              "$SCCACHE_DIR/.write-test"
          '

      - name: Patch Termux free-space script
        shell: bash
        run: |
          set -euxo pipefail

          SCRIPT="scripts/free-space.sh"

          sed -i \
            '/ruby3\.2-doc/d' \
            "$SCRIPT"

          if grep -q \
            'ruby3.2-doc' \
            "$SCRIPT"; then
            echo "ERROR: ruby3.2-doc still present"
            exit 1
          fi

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "Disk before cleanup"
          echo "======================================"

          df -h

          ./scripts/free-space.sh

          echo
          echo "======================================"
          echo "Disk after cleanup"
          echo "======================================"

          df -h

      - name: Reset sccache statistics
        shell: bash
        run: |
          set -euxo pipefail

          ./scripts/run-docker.sh \
            env \
              SCCACHE_DIR=/home/builder/.cache/sccache \
              SCCACHE_CACHE_SIZE=6G \
            sccache --zero-stats

      - name: Build Firefox
        id: build-firefox
        shell: bash
        run: |
          set -o pipefail

          echo "======================================"
          echo "Starting Firefox native sandbox v2 build"
          echo "======================================"

          ./scripts/run-docker.sh \
            env \
              SCCACHE_DIR=/home/builder/.cache/sccache \
              SCCACHE_CACHE_SIZE=6G \
            ./build-package.sh \
              -f \
              -I \
              -a aarch64 \
              firefox \
            2>&1 | tee firefox-build.log

      - name: Show sccache statistics
        if: always()
        shell: bash
        run: |
          ./scripts/run-docker.sh \
            env \
              SCCACHE_DIR=/home/builder/.cache/sccache \
              SCCACHE_CACHE_SIZE=6G \
            sccache --show-stats || true

      - name: Build diagnostics
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "Firefox modifications"
          echo "======================================"

          git diff -- \
            x11-packages/firefox/ || true

          echo
          echo "======================================"
          echo "Disk / Docker / cache"
          echo "======================================"

          df -h || true
          docker ps -a || true

          du -sh \
            .sccache \
            2>/dev/null || true

          echo
          echo "======================================"
          echo "Sandbox/Bionic/preflight markers"
          echo "======================================"

          grep -nEi \
            'preflight|security/sandbox|libmozsandbox|libxul|PR_PAC_RESET_KEYS|PR_GET_DUMPABLE|mremap|MREMAP_FIXED|getrlimit|AddSharedMemoryPaths|org\.mozilla\.ipc|system/fonts|shm_open|ShmSegmentsWriter|timezone_prop|undefined symbol|duplicate symbol|ld\.lld: error|patch.*FAILED|Hunk.*FAILED' \
            firefox-build.log \
            2>/dev/null \
            | tail -n 400 || true

          echo
          echo "======================================"
          echo "Generated DEB files"
          echo "======================================"

          find output \
            -type f \
            -name 'firefox_*.deb' \
            -print \
            2>/dev/null || true

          echo
          echo "======================================"
          echo "Last 600 build lines"
          echo "======================================"

          tail -n 600 \
            firefox-build.log \
            2>/dev/null || true

      - name: Save Firefox sccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .sccache
          key: firefox-native-sandbox-sccache-aarch64-v8-${{ github.run_id }}

      - name: Collect Firefox package
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          find output \
            -type f \
            -name 'firefox_*.deb' \
            -print \
            -exec cp -v '{}' artifacts/ ';'

          cp \
            firefox-native-sandbox-changes.diff \
            artifacts/

          cp \
            x11-packages/firefox/9999-termux-native-sandbox.patch \
            artifacts/

          cp \
            termux-firefox-native-sandbox-test.sh \
            artifacts/

          DEB="$(
            find artifacts \
              -maxdepth 1 \
              -type f \
              -name 'firefox_*.deb' \
              -print -quit
          )"

          if [ -z "$DEB" ]; then
            echo "ERROR: Firefox .deb not found"
            exit 1
          fi

          (
            cd artifacts

            sha256sum \
              firefox_*.deb \
              > SHA256SUMS
          )

          echo "======================================"
          echo "Final artifacts"
          echo "======================================"

          ls -lh artifacts/

      - name: Upload Firefox native sandbox package
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: firefox-native-sandbox-aarch64-v2
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: firefox-native-sandbox-build-diagnostics-v2
          path: |
            firefox-build.log
            firefox-native-sandbox-changes.diff
            x11-packages/firefox/9999-termux-native-sandbox.patch
            termux-firefox-native-sandbox-test.sh
          if-no-files-found: ignore
          retention-days: 14
