name: Build Termux Firefox with Sandbox

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firefox-sandbox-${{ github.ref }}
  cancel-in-progress: false

env:
  TERMUX_BUILDER_IMAGE_NAME: termux-firefox-builder:sccache

jobs:
  build:
    name: Firefox Sandbox aarch64
    runs-on: ubuntu-26.04
    timeout-minutes: 355

    steps:
      # ============================================================
      # 1. Checkout latest upstream Termux packages
      # ============================================================
      - name: Checkout termux-packages
        uses: actions/checkout@v7
        with:
          repository: termux/termux-packages
          ref: master
          fetch-depth: 1

      # ============================================================
      # 2. Verify current Firefox recipe
      # ============================================================
      - name: Verify Firefox recipe
        shell: bash
        run: |
          set -euxo pipefail

          FIREFOX_DIR="x11-packages/firefox"
          MOZCONFIG="$FIREFOX_DIR/mozconfig.cfg"
          BUILD_SH="$FIREFOX_DIR/build.sh"

          test -d "$FIREFOX_DIR"
          test -f "$MOZCONFIG"
          test -f "$BUILD_SH"

          echo "======================================"
          echo "Upstream Termux commit"
          echo "======================================"
          git rev-parse HEAD

          echo
          echo "======================================"
          echo "Firefox version"
          echo "======================================"

          grep '^TERMUX_PKG_VERSION=' "$BUILD_SH"
          grep '^TERMUX_PKG_REVISION=' "$BUILD_SH" || true

          echo
          echo "======================================"
          echo "Current sandbox configuration"
          echo "======================================"

          grep -n 'sandbox' "$MOZCONFIG"

          # Fail safely if upstream changes its default unexpectedly.
          grep -q '^ac_add_options --disable-sandbox$' "$MOZCONFIG"

      # ============================================================
      # 3. Enable Firefox sandbox
      #
      # Also:
      #
      # --disable-forkserver
      #
      # Termux makes the Android/Bionic target appear as GNU/Linux
      # to Mozilla. This enables the Linux forkserver by default.
      #
      # With MOZ_SANDBOX enabled that brings in Mozilla's
      # pthread_atfork interposer, which collides with Bionic's
      # crtbegin_dynamic.o pthread_atfork symbol.
      #
      # The forkserver is not required for the seccomp sandbox itself.
      # ============================================================
      - name: Enable Firefox sandbox
        shell: bash
        run: |
          set -euxo pipefail

          MOZCONFIG="x11-packages/firefox/mozconfig.cfg"

          sed -i \
            's/^ac_add_options --disable-sandbox$/ac_add_options --enable-sandbox/' \
            "$MOZCONFIG"

          if ! grep -q '^ac_add_options --disable-forkserver$' "$MOZCONFIG"; then
            echo 'ac_add_options --disable-forkserver' >> "$MOZCONFIG"
          fi

          if ! grep -q '^ac_add_options --with-ccache=sccache$' "$MOZCONFIG"; then
            echo 'ac_add_options --with-ccache=sccache' >> "$MOZCONFIG"
          fi

          echo "======================================"
          echo "Modified mozconfig"
          echo "======================================"

          grep -nE 'sandbox|forkserver|ccache' "$MOZCONFIG"

          grep -q '^ac_add_options --enable-sandbox$' "$MOZCONFIG"
          grep -q '^ac_add_options --disable-forkserver$' "$MOZCONFIG"
          grep -q '^ac_add_options --with-ccache=sccache$' "$MOZCONFIG"

      # ============================================================
      # 4. Termux/Bionic compatibility patch for Linux sandbox
      #
      # Fix 1:
      #   SandboxReporterCommon.h needs <time.h> for struct timespec.
      #
      # Fix 2:
      #   Disable Chromium priority-inheritance mutex path on Termux.
      #
      # Fix 3:
      #   Skip glibc-specific shm_open lazy initialization on Bionic.
      # ============================================================
      - name: Add Termux sandbox compatibility patch
        shell: bash
        run: |
          set -euxo pipefail

          PATCH="x11-packages/firefox/9999-termux-sandbox-compat.patch"

          cat > "$PATCH" <<'PATCH'
          --- a/security/sandbox/linux/reporter/SandboxReporterCommon.h
          +++ b/security/sandbox/linux/reporter/SandboxReporterCommon.h
          @@ -6,6 +6,7 @@
           #ifndef mozilla_SandboxReporterCommon_h
           #define mozilla_SandboxReporterCommon_h

          +#include <time.h>
           #include <sys/types.h>

           #include "mozilla/IntegerTypeTraits.h"

          --- a/security/sandbox/chromium/base/synchronization/lock_impl_posix.cc
          +++ b/security/sandbox/chromium/base/synchronization/lock_impl_posix.cc
          @@ -99,7 +99,7 @@
           // Lock::PriorityInheritanceAvailable still must be checked as the code may
           // compile but the underlying platform still may not correctly support priority
           // inheritance locks.
          -#if BUILDFLAG(IS_FUCHSIA)
          +#if BUILDFLAG(IS_FUCHSIA) || defined(__TERMUX__)
           #define PRIORITY_INHERITANCE_LOCKS_POSSIBLE() 0
           #else
           #define PRIORITY_INHERITANCE_LOCKS_POSSIBLE() 1

          --- a/security/sandbox/linux/Sandbox.cpp
          +++ b/security/sandbox/linux/Sandbox.cpp
          @@ -558,6 +558,7 @@
             }
           }

          +#if !defined(__TERMUX__)
           static void RunGlibcLazyInitializers() {
             // Make glibc's lazy initialization of shm_open() run before sandboxing
             int fd = shm_open("/dummy", O_RDONLY, 0);
          @@ -566,6 +567,7 @@
               close(fd);  // In the unlikely case we actually opened something
             }
           }
          +#endif

           static void SandboxLateInit() {
           #ifdef NIGHTLY_BUILD
          @@ -585,7 +587,9 @@
             }
           #endif

          +#if !defined(__TERMUX__)
             RunGlibcLazyInitializers();
          +#endif

             // This will run on main thread before  it is in a signal-handler context, to
             // make sure rprofiler pointers are properly initialized (and send a marker
          PATCH

          # Show new file in git diff without committing it.
          git add -N "$PATCH"

          echo "======================================"
          echo "Sandbox compatibility patch"
          echo "======================================"

          cat "$PATCH"

      # ============================================================
      # 5. Increase our Firefox package revision
      #
      # official:
      #   155.0.1
      #
      # ours:
      #   155.0.1-1
      #
      # official:
      #   155.0.1-2
      #
      # ours:
      #   155.0.1-3
      # ============================================================
      - name: Increase custom package revision
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("x11-packages/firefox/build.sh")
          text = path.read_text()

          revision = re.search(
              r"^TERMUX_PKG_REVISION=(\d+)\s*$",
              text,
              flags=re.MULTILINE,
          )

          if revision:
              old_revision = int(revision.group(1))
              new_revision = old_revision + 1

              text = (
                  text[:revision.start()]
                  + f"TERMUX_PKG_REVISION={new_revision}"
                  + text[revision.end():]
              )

          else:
              version = re.search(
                  r"^TERMUX_PKG_VERSION=.*$",
                  text,
                  flags=re.MULTILINE,
              )

              if not version:
                  raise SystemExit(
                      "TERMUX_PKG_VERSION not found"
                  )

              text = (
                  text[:version.end()]
                  + "\nTERMUX_PKG_REVISION=1"
                  + text[version.end():]
              )

          path.write_text(text)
          PY

          echo "======================================"
          echo "Custom Firefox package"
          echo "======================================"

          grep '^TERMUX_PKG_VERSION=' \
            x11-packages/firefox/build.sh

          grep '^TERMUX_PKG_REVISION=' \
            x11-packages/firefox/build.sh

      # ============================================================
      # 6. Save complete source modifications
      # ============================================================
      - name: Save custom changes
        shell: bash
        run: |
          set -euxo pipefail

          git diff -- x11-packages/firefox/ \
            | tee firefox-sandbox-changes.diff

          echo
          echo "======================================"
          echo "Git status"
          echo "======================================"

          git status --short x11-packages/firefox/

      # ============================================================
      # 7. Restore previous sccache
      #
      # restore and save are deliberately separated.
      #
      # This means the cache can be saved even if Firefox compilation
      # fails later.
      # ============================================================
      - name: Restore Firefox sccache
        id: sccache-restore
        uses: actions/cache/restore@v4
        with:
          path: .sccache
          key: firefox-sccache-aarch64-v5-${{ github.run_id }}
          restore-keys: |
            firefox-sccache-aarch64-v5-

      # ============================================================
      # 8. Prepare host-side compiler cache
      # ============================================================
      - name: Prepare sccache directory
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p .sccache

          sudo chown -R \
            "$(id -u):$(id -g)" \
            .sccache

          chmod -R a+rwX .sccache

          echo "======================================"
          echo "Host sccache"
          echo "======================================"

          ls -ld .sccache
          du -sh .sccache || true

      # ============================================================
      # 9. Enable zram
      # ============================================================
      - name: Enable zram
        uses: ./.github/actions/zram
        with:
          algorithm: zstd
          size: 16G
          priority: 100
          device_name: /dev/zram0

      # ============================================================
      # 10. Prepare official Termux package builder
      #
      # GHCR occasionally resets large layer downloads, so retry.
      #
      # If all retries fail, build upstream builder locally.
      # ============================================================
      - name: Prepare official Termux builder
        shell: bash
        run: |
          set -euo pipefail

          BASE_IMAGE="ghcr.io/termux/package-builder:latest"
          PULLED=0

          for attempt in 1 2 3 4 5; do
            echo
            echo "======================================"
            echo "Base image pull ${attempt}/5"
            echo "======================================"

            if docker pull "$BASE_IMAGE"; then
              PULLED=1
              break
            fi

            echo "Docker pull failed."

            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 15))

              echo "Retrying in ${delay}s..."

              sleep "$delay"
            fi
          done

          if [ "$PULLED" -ne 1 ]; then
            echo
            echo "======================================"
            echo "GHCR repeatedly failed"
            echo "Building upstream Termux builder"
            echo "======================================"

            docker build \
              -t "$BASE_IMAGE" \
              scripts/

            docker buildx prune -af || true
          fi

          echo
          echo "======================================"
          echo "Official builder"
          echo "======================================"

          docker image inspect \
            "$BASE_IMAGE" \
            --format \
            'ID={{.Id}} Size={{.Size}} Created={{.Created}}'

      # ============================================================
      # 11. Create derived builder containing sccache
      #
      # Installing it here avoids sudo inside Termux's restricted
      # AppArmor environment.
      # ============================================================
      - name: Build Firefox builder with sccache
        shell: bash
        run: |
          set -euxo pipefail

          cat > /tmp/Dockerfile.firefox-sccache <<'DOCKERFILE'
          FROM ghcr.io/termux/package-builder:latest

          USER root

          RUN apt-get update \
              && apt-get install \
                   -yq \
                   --no-install-recommends \
                   sccache \
              && apt-get clean \
              && rm -rf /var/lib/apt/lists/*

          USER builder:builder

          WORKDIR /home/builder/termux-packages
          DOCKERFILE

          docker build \
            -f /tmp/Dockerfile.firefox-sccache \
            -t "$TERMUX_BUILDER_IMAGE_NAME" \
            .

          echo
          echo "======================================"
          echo "Derived Firefox builder"
          echo "======================================"

          docker image inspect \
            "$TERMUX_BUILDER_IMAGE_NAME" \
            --format \
            'ID={{.Id}} Size={{.Size}} Created={{.Created}}'

      # ============================================================
      # 12. Create builder container
      #
      # We cannot put sccache under:
      #
      # /home/builder/termux-packages/
      #
      # because Termux's restricted AppArmor profile prevents writes
      # to most of that tree.
      #
      # Host:
      #   $GITHUB_WORKSPACE/.sccache
      #
      # Container:
      #   /home/builder/.cache/sccache
      # ============================================================
      - name: Start Termux builder
        shell: bash
        run: |
          set -euxo pipefail

          docker rm -f \
            termux-package-builder \
            2>/dev/null || true

          export TERMUX_DOCKER_RUN_EXTRA_ARGS="--volume ${GITHUB_WORKSPACE}/.sccache:/home/builder/.cache/sccache"

          ./scripts/run-docker.sh true

          echo
          echo "======================================"
          echo "Containers"
          echo "======================================"

          docker ps -a

          echo
          echo "======================================"
          echo "Container mounts"
          echo "======================================"

          docker inspect \
            termux-package-builder \
            --format \
            '{{range .Mounts}}{{println .Source "->" .Destination}}{{end}}'

      # ============================================================
      # 13. Verify sccache binary exists
      # ============================================================
      - name: Verify sccache
        shell: bash
        run: |
          set -euxo pipefail

          ./scripts/run-docker.sh bash -lc '
            set -e

            echo "======================================"
            echo "sccache"
            echo "======================================"

            command -v sccache
            sccache --version
          '

      # ============================================================
      # 14. Verify cache is writable before starting a huge build
      # ============================================================
      - name: Verify sccache cache access
        shell: bash
        run: |
          set -euxo pipefail

          ./scripts/run-docker.sh bash -lc '
            set -euxo pipefail

            export SCCACHE_DIR=/home/builder/.cache/sccache
            export SCCACHE_CACHE_SIZE=6G

            echo "======================================"
            echo "Builder identity"
            echo "======================================"

            id

            echo
            echo "======================================"
            echo "Cache directory"
            echo "======================================"

            ls -ld "$SCCACHE_DIR"

            echo
            echo "======================================"
            echo "Cache write test"
            echo "======================================"

            touch "$SCCACHE_DIR/.write-test"

            echo "test" > "$SCCACHE_DIR/.write-test"

            cat "$SCCACHE_DIR/.write-test"

            rm "$SCCACHE_DIR/.write-test"

            echo
            echo "Cache write test: SUCCESS"
          '

      # ============================================================
      # 15. Work around current Termux free-space.sh Ubuntu 26.04
      #     ruby3.2-doc issue
      # ============================================================
      - name: Patch Termux free-space script
        shell: bash
        run: |
          set -euxo pipefail

          SCRIPT="scripts/free-space.sh"

          echo "======================================"
          echo "ruby3.2-doc before patch"
          echo "======================================"

          grep -n 'ruby3.2-doc' "$SCRIPT" || true

          sed -i \
            '/ruby3\.2-doc/d' \
            "$SCRIPT"

          echo
          echo "======================================"
          echo "ruby3.2-doc after patch"
          echo "======================================"

          if grep -n 'ruby3.2-doc' "$SCRIPT"; then
            echo "ERROR: ruby3.2-doc still present"
            exit 1
          fi

          echo "ruby3.2-doc removed."

      # ============================================================
      # 16. Free runner disk space
      #
      # Docker builder/container have already been created before
      # this script deletes containerd cached blobs.
      # ============================================================
      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "Disk before cleanup"
          echo "======================================"

          df -h

          ./scripts/free-space.sh

          echo
          echo "======================================"
          echo "Disk after cleanup"
          echo "======================================"

          df -h

      # ============================================================
      # 17. Reset compiler-cache statistics
      # ============================================================
      - name: Reset sccache statistics
        shell: bash
        run: |
          set -euxo pipefail

          ./scripts/run-docker.sh \
            env \
              SCCACHE_DIR=/home/builder/.cache/sccache \
              SCCACHE_CACHE_SIZE=6G \
            sccache --zero-stats

      # ============================================================
      # 18. Build Firefox
      #
      # -f : force Firefox itself
      # -I : install dependencies from Termux repository
      # ============================================================
      - name: Build Firefox
        id: build-firefox
        shell: bash
        run: |
          set -o pipefail

          echo "======================================"
          echo "Starting Firefox sandbox build"
          echo "======================================"

          ./scripts/run-docker.sh \
            env \
              SCCACHE_DIR=/home/builder/.cache/sccache \
              SCCACHE_CACHE_SIZE=6G \
            ./build-package.sh \
              -f \
              -I \
              -a aarch64 \
              firefox \
            2>&1 | tee firefox-build.log

      # ============================================================
      # 19. Show cache statistics regardless of build result
      # ============================================================
      - name: Show sccache statistics
        if: always()
        shell: bash
        run: |
          ./scripts/run-docker.sh \
            env \
              SCCACHE_DIR=/home/builder/.cache/sccache \
              SCCACHE_CACHE_SIZE=6G \
            sccache --show-stats || true

      # ============================================================
      # 20. Build diagnostics
      # ============================================================
      - name: Build diagnostics
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "Firefox modifications"
          echo "======================================"

          git diff -- x11-packages/firefox/ || true

          echo
          echo "======================================"
          echo "Disk"
          echo "======================================"

          df -h || true

          echo
          echo "======================================"
          echo "Docker"
          echo "======================================"

          docker ps -a || true

          echo
          echo "======================================"
          echo "sccache directory"
          echo "======================================"

          du -sh .sccache \
            2>/dev/null || true

          echo
          echo "======================================"
          echo "Generated DEBs"
          echo "======================================"

          find output \
            -type f \
            -name '*.deb' \
            -print \
            2>/dev/null || true

          find termux-packages/output \
            -type f \
            -name '*.deb' \
            -print \
            2>/dev/null || true

          echo
          echo "======================================"
          echo "Sandbox build markers"
          echo "======================================"

          grep -nE \
            'security/sandbox|libmozsandbox|pthread_atfork|ld\.lld: error|undefined symbol|duplicate symbol' \
            firefox-build.log \
            2>/dev/null \
            | tail -n 100 || true

          echo
          echo "======================================"
          echo "Last 350 Firefox build lines"
          echo "======================================"

          tail -n 350 \
            firefox-build.log \
            2>/dev/null || true

      # ============================================================
      # 21. Save sccache EVEN WHEN BUILD FAILS
      #
      # This is important for iterative sandbox porting.
      #
      # A unique run_id key is used so the cache can be written.
      # The next run restores the newest v5 cache through
      # restore-keys.
      # ============================================================
      - name: Save Firefox sccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .sccache
          key: firefox-sccache-aarch64-v5-${{ github.run_id }}

      # ============================================================
      # 22. Collect successful package
      # ============================================================
      - name: Collect Firefox package
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          find \
            output \
            termux-packages/output \
            -type f \
            -name 'firefox_*.deb' \
            -print \
            -exec cp -v '{}' artifacts/ ';' \
            2>/dev/null || true

          cp \
            firefox-sandbox-changes.diff \
            artifacts/

          cp \
            x11-packages/firefox/9999-termux-sandbox-compat.patch \
            artifacts/

          DEB="$(
            find artifacts \
              -maxdepth 1 \
              -type f \
              -name 'firefox_*.deb' \
              -print -quit
          )"

          if [ -z "$DEB" ]; then
            echo "ERROR: Firefox .deb not found"
            exit 1
          fi

          (
            cd artifacts

            sha256sum \
              firefox_*.deb \
              > SHA256SUMS
          )

          echo
          echo "======================================"
          echo "Final Firefox artifacts"
          echo "======================================"

          ls -lh artifacts/

      # ============================================================
      # 23. Upload successful Firefox package
      # ============================================================
      - name: Upload Firefox sandbox package
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: firefox-sandbox-aarch64
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # ============================================================
      # 24. Always keep failure diagnostics
      # ============================================================
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: firefox-sandbox-build-diagnostics
          path: |
            firefox-build.log
            firefox-sandbox-changes.diff
            x11-packages/firefox/9999-termux-sandbox-compat.patch
          if-no-files-found: ignore
          retention-days: 14
