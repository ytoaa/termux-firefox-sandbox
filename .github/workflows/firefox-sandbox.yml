name: Build Termux Firefox Native Sandbox Port

on:
  workflow_dispatch:
    inputs:
      termux_ref:
        description: termux/termux-packages ref to build
        required: false
        default: master

permissions:
  contents: read

concurrency:
  group: firefox-native-sandbox-${{ github.ref }}
  cancel-in-progress: false

env:
  TERMUX_BUILDER_IMAGE_NAME: termux-firefox-builder:sccache

jobs:
  build:
    name: Firefox native sandbox aarch64
    runs-on: ubuntu-26.04
    timeout-minutes: 355

    steps:
      - name: Checkout sandbox port
        uses: actions/checkout@v7
        with:
          path: portrepo
          fetch-depth: 1

      - name: Checkout termux-packages
        uses: actions/checkout@v7
        with:
          repository: termux/termux-packages
          ref: ${{ inputs.termux_ref }}
          path: termux-packages
          fetch-depth: 1

      - name: Validate port tools
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile \
            portrepo/port/prepare_recipe.py \
            portrepo/port/firefox_sandbox_port.py
          bash -n portrepo/port/ci.sh
          bash -n portrepo/port/runtime-test.sh
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          cfg = tomllib.loads(Path("portrepo/port/port.toml").read_text())
          assert cfg["port"]["version"]
          assert cfg["port"]["policy_mode"] == "fail-closed"
          assert cfg["compatibility"]["runtime_policy_scopes"] == [
              "Content", "RDD", "Socket", "Utility"
          ]
          PY

      - name: Prepare Firefox recipe
        id: prepare
        shell: bash
        run: |
          set -euxo pipefail
          python3 portrepo/port/prepare_recipe.py \
            --firefox-dir termux-packages/x11-packages/firefox \
            --metadata firefox-port-metadata.json

          termux_commit="$(git -C termux-packages rev-parse HEAD)"
          python3 - "$termux_commit" <<'PY'
          import json, sys
          path = "firefox-port-metadata.json"
          data = json.load(open(path))
          data["termux_packages_commit"] = sys.argv[1]
          open(path, "w").write(json.dumps(data, indent=2, sort_keys=True) + "\n")
          PY

          python3 - <<'PY' > /tmp/firefox-port-env
          import json
          m = json.load(open("firefox-port-metadata.json"))
          candidate = str(m["candidate"]).lower()
          print(f"FIREFOX_VERSION={m['firefox_version']}")
          print(f"FIREFOX_CANDIDATE={candidate}")
          print(f"PORT_VERSION={m['port_version']}")
          PY
          cat /tmp/firefox-port-env >> "$GITHUB_ENV"
          candidate="$(grep '^FIREFOX_CANDIDATE=' /tmp/firefox-port-env | cut -d= -f2-)"
          version="$(grep '^FIREFOX_VERSION=' /tmp/firefox-port-env | cut -d= -f2-)"
          port_version="$(grep '^PORT_VERSION=' /tmp/firefox-port-env | cut -d= -f2-)"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "firefox_version=$version" >> "$GITHUB_OUTPUT"
          echo "port_version=$port_version" >> "$GITHUB_OUTPUT"

          cat firefox-port-metadata.json
          git -C termux-packages diff -- x11-packages/firefox || true
          git -C termux-packages status --short x11-packages/firefox
          git -C termux-packages diff -- x11-packages/firefox \
            > firefox-recipe-changes.diff

      - name: Candidate compatibility notice
        if: steps.prepare.outputs.candidate == 'true'
        shell: bash
        run: |
          echo "::warning::Firefox ${FIREFOX_VERSION} differs from the last validated release."
          echo "The semantic port will continue, but any changed security contract fails closed."

      - name: Restore Firefox sccache
        uses: actions/cache/restore@v4
        with:
          path: termux-packages/.sccache
          key: firefox-native-sandbox-semantic-aarch64-v1-${{ github.run_id }}
          restore-keys: |
            firefox-native-sandbox-semantic-aarch64-v1-
            firefox-native-sandbox-sccache-aarch64-v15-

      - name: Enable zram
        uses: ./termux-packages/.github/actions/zram
        with:
          algorithm: zstd
          size: 16G
          priority: 100
          device_name: /dev/zram0

      - name: Prepare Termux builder
        shell: bash
        run: portrepo/port/ci.sh prepare-builder termux-packages

      - name: Build Firefox
        id: build-firefox
        shell: bash
        run: portrepo/port/ci.sh build termux-packages

      - name: Show sccache statistics
        if: always()
        shell: bash
        run: portrepo/port/ci.sh stats termux-packages

      - name: Collect semantic port diagnostics
        if: always()
        shell: bash
        run: portrepo/port/ci.sh diagnostics termux-packages

      - name: Save Firefox sccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: termux-packages/.sccache
          key: firefox-native-sandbox-semantic-aarch64-v1-${{ github.run_id }}

      - name: Collect Firefox package
        if: success()
        shell: bash
        run: |
          portrepo/port/ci.sh collect \
            termux-packages \
            portrepo \
            firefox-port-metadata.json \
            firefox-recipe-changes.diff \
            artifacts

      - name: Upload Firefox native sandbox package
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: firefox-native-sandbox-aarch64-v${{ steps.prepare.outputs.port_version }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: firefox-native-sandbox-build-diagnostics-v${{ steps.prepare.outputs.port_version }}
          path: |
            firefox-port-metadata.json
            firefox-recipe-changes.diff
            termux-packages/firefox-build.log
            termux-packages/firefox-native-sandbox-port-report.json
            termux-packages/firefox-native-sandbox.generated.patch
          if-no-files-found: ignore
          retention-days: 14
