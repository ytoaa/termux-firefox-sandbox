name: Build Termux Firefox with Sandbox

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firefox-sandbox-${{ github.ref }}
  cancel-in-progress: false

env:
  TERMUX_BUILDER_IMAGE_NAME: termux-firefox-builder:sccache

jobs:
  build:
    name: Firefox Sandbox aarch64
    runs-on: ubuntu-26.04
    timeout-minutes: 355

    steps:
      # ============================================================
      # 1. Checkout current upstream Termux packages
      # ============================================================
      - name: Checkout termux-packages
        uses: actions/checkout@v7
        with:
          repository: termux/termux-packages
          ref: master
          fetch-depth: 1

      # ============================================================
      # 2. Verify Firefox recipe
      # ============================================================
      - name: Verify Firefox recipe
        shell: bash
        run: |
          set -euxo pipefail

          FIREFOX_DIR="x11-packages/firefox"
          MOZCONFIG="$FIREFOX_DIR/mozconfig.cfg"
          BUILD_SH="$FIREFOX_DIR/build.sh"

          test -d "$FIREFOX_DIR"
          test -f "$MOZCONFIG"
          test -f "$BUILD_SH"

          echo "======================================"
          echo "Upstream Termux commit"
          echo "======================================"
          git rev-parse HEAD

          echo
          echo "======================================"
          echo "Firefox version"
          echo "======================================"

          grep '^TERMUX_PKG_VERSION=' "$BUILD_SH"
          grep '^TERMUX_PKG_REVISION=' "$BUILD_SH" || true

          echo
          echo "======================================"
          echo "Current sandbox config"
          echo "======================================"

          grep -n 'sandbox' "$MOZCONFIG"

          # If upstream changes this unexpectedly,
          # fail instead of generating an unknown package.
          grep -q '^ac_add_options --disable-sandbox$' "$MOZCONFIG"

      # ============================================================
      # 3. Enable Firefox sandbox + sccache
      # ============================================================
      - name: Enable Firefox sandbox
        shell: bash
        run: |
          set -euxo pipefail

          MOZCONFIG="x11-packages/firefox/mozconfig.cfg"

          sed -i \
            's/^ac_add_options --disable-sandbox$/ac_add_options --enable-sandbox/' \
            "$MOZCONFIG"

          if ! grep -q '^ac_add_options --with-ccache=sccache$' "$MOZCONFIG"; then
            echo 'ac_add_options --with-ccache=sccache' >> "$MOZCONFIG"
          fi

          echo "======================================"
          echo "Modified mozconfig"
          echo "======================================"

          grep -nE 'sandbox|ccache' "$MOZCONFIG"

          grep -q '^ac_add_options --enable-sandbox$' "$MOZCONFIG"
          grep -q '^ac_add_options --with-ccache=sccache$' "$MOZCONFIG"

      # ============================================================
      # 4. Termux/Bionic compatibility patch
      #
      # Fix 1:
      #   <time.h> for struct timespec
      #
      # Fix 2:
      #   disable pthread priority inheritance path on Termux
      #
      # Fix 3:
      #   skip glibc-specific shm_open lazy initializer
      # ============================================================
      - name: Add Termux sandbox compatibility patch
        shell: bash
        run: |
          set -euxo pipefail

          PATCH="x11-packages/firefox/9999-termux-sandbox-compat.patch"

          cat > "$PATCH" <<'PATCH'
          --- a/security/sandbox/linux/reporter/SandboxReporterCommon.h
          +++ b/security/sandbox/linux/reporter/SandboxReporterCommon.h
          @@ -6,6 +6,7 @@
           #ifndef mozilla_SandboxReporterCommon_h
           #define mozilla_SandboxReporterCommon_h

          +#include <time.h>
           #include <sys/types.h>

           #include "mozilla/IntegerTypeTraits.h"

          --- a/security/sandbox/chromium/base/synchronization/lock_impl_posix.cc
          +++ b/security/sandbox/chromium/base/synchronization/lock_impl_posix.cc
          @@ -99,7 +99,7 @@
           // Lock::PriorityInheritanceAvailable still must be checked as the code may
           // compile but the underlying platform still may not correctly support priority
           // inheritance locks.
          -#if BUILDFLAG(IS_FUCHSIA)
          +#if BUILDFLAG(IS_FUCHSIA) || defined(__TERMUX__)
           #define PRIORITY_INHERITANCE_LOCKS_POSSIBLE() 0
           #else
           #define PRIORITY_INHERITANCE_LOCKS_POSSIBLE() 1

          --- a/security/sandbox/linux/Sandbox.cpp
          +++ b/security/sandbox/linux/Sandbox.cpp
          @@ -558,6 +558,7 @@
             }
           }

          +#if !defined(__TERMUX__)
           static void RunGlibcLazyInitializers() {
             // Make glibc's lazy initialization of shm_open() run before sandboxing
             int fd = shm_open("/dummy", O_RDONLY, 0);
          @@ -566,6 +567,7 @@
               close(fd);  // In the unlikely case we actually opened something
             }
           }
          +#endif

           static void SandboxLateInit() {
           #ifdef NIGHTLY_BUILD
          @@ -585,7 +587,9 @@
             }
           #endif

          +#if !defined(__TERMUX__)
             RunGlibcLazyInitializers();
          +#endif

             // This will run on main thread before  it is in a signal-handler context, to
             // make sure rprofiler pointers are properly initialized (and send a marker
          PATCH

          # Allow git diff to show the new untracked patch.
          git add -N "$PATCH"

          echo "======================================"
          echo "Sandbox compatibility patch"
          echo "======================================"

          cat "$PATCH"

      # ============================================================
      # 5. Increase custom package revision
      #
      # official:
      #   155.0.1
      #
      # ours:
      #   155.0.1-1
      #
      # official:
      #   155.0.1-2
      #
      # ours:
      #   155.0.1-3
      # ============================================================
      - name: Increase custom package revision
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("x11-packages/firefox/build.sh")
          text = path.read_text()

          revision = re.search(
              r"^TERMUX_PKG_REVISION=(\d+)\s*$",
              text,
              flags=re.MULTILINE,
          )

          if revision:
              old_revision = int(revision.group(1))
              new_revision = old_revision + 1

              text = (
                  text[:revision.start()]
                  + f"TERMUX_PKG_REVISION={new_revision}"
                  + text[revision.end():]
              )

          else:
              version = re.search(
                  r"^TERMUX_PKG_VERSION=.*$",
                  text,
                  flags=re.MULTILINE,
              )

              if not version:
                  raise SystemExit(
                      "TERMUX_PKG_VERSION not found"
                  )

              text = (
                  text[:version.end()]
                  + "\nTERMUX_PKG_REVISION=1"
                  + text[version.end():]
              )

          path.write_text(text)
          PY

          echo "======================================"
          echo "Custom Firefox version"
          echo "======================================"

          grep '^TERMUX_PKG_VERSION=' \
            x11-packages/firefox/build.sh

          grep '^TERMUX_PKG_REVISION=' \
            x11-packages/firefox/build.sh

      # ============================================================
      # 6. Save all package modifications
      # ============================================================
      - name: Save custom changes
        shell: bash
        run: |
          set -euxo pipefail

          git diff -- x11-packages/firefox/ \
            | tee firefox-sandbox-changes.diff

          echo
          echo "======================================"
          echo "Git status"
          echo "======================================"

          git status --short x11-packages/firefox/

      # ============================================================
      # 7. Restore persistent sccache
      #
      # Each run gets a unique key so the new cache can be saved.
      # restore-keys will retrieve the newest previous cache.
      # ============================================================
      - name: Restore Firefox sccache
        uses: actions/cache@v4
        with:
          path: .sccache
          key: firefox-sccache-aarch64-v4-${{ github.run_id }}
          restore-keys: |
            firefox-sccache-aarch64-v4-

      # ============================================================
      # 8. Prepare host-side cache directory
      # ============================================================
      - name: Prepare sccache directory
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p .sccache

          # Cache contents restored by actions/cache may have
          # restrictive permissions.
          sudo chown -R "$(id -u):$(id -g)" .sccache

          chmod -R a+rwX .sccache

          echo "======================================"
          echo "Host sccache directory"
          echo "======================================"

          ls -ld .sccache

      # ============================================================
      # 9. Enable zram
      #
      # Same 16G size used by upstream Termux CI for large builds.
      # ============================================================
      - name: Enable zram
        uses: ./.github/actions/zram
        with:
          algorithm: zstd
          size: 16G
          priority: 100
          device_name: /dev/zram0

      # ============================================================
      # 10. Prepare official Termux Docker builder
      #
      # Retry GHCR because GitHub occasionally resets downloads.
      #
      # If all pulls fail, build upstream builder locally.
      # ============================================================
      - name: Prepare official Termux builder
        shell: bash
        run: |
          set -euo pipefail

          BASE_IMAGE="ghcr.io/termux/package-builder:latest"

          PULLED=0

          for attempt in 1 2 3 4 5; do
            echo
            echo "======================================"
            echo "Base image pull ${attempt}/5"
            echo "======================================"

            if docker pull "$BASE_IMAGE"; then
              PULLED=1
              break
            fi

            echo "Docker pull failed."

            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 15))

              echo "Retrying in ${delay}s..."

              sleep "$delay"
            fi
          done

          if [ "$PULLED" -ne 1 ]; then
            echo
            echo "======================================"
            echo "GHCR repeatedly failed"
            echo "Building upstream Termux builder"
            echo "======================================"

            docker build \
              -t "$BASE_IMAGE" \
              scripts/

            docker buildx prune -af || true
          fi

          echo
          echo "======================================"
          echo "Official builder"
          echo "======================================"

          docker image inspect "$BASE_IMAGE" \
            --format \
            'ID={{.Id}} Size={{.Size}} Created={{.Created}}'

      # ============================================================
      # 11. Build derived Firefox builder containing sccache
      #
      # sccache is installed here as root, before Termux restricted
      # AppArmor is applied.
      # ============================================================
      - name: Build Firefox builder with sccache
        shell: bash
        run: |
          set -euxo pipefail

          cat > /tmp/Dockerfile.firefox-sccache <<'DOCKERFILE'
          FROM ghcr.io/termux/package-builder:latest

          USER root

          RUN apt-get update \
              && apt-get install \
                   -yq \
                   --no-install-recommends \
                   sccache \
              && apt-get clean \
              && rm -rf /var/lib/apt/lists/*

          USER builder:builder

          WORKDIR /home/builder/termux-packages
          DOCKERFILE

          docker build \
            -f /tmp/Dockerfile.firefox-sccache \
            -t "$TERMUX_BUILDER_IMAGE_NAME" \
            .

          echo
          echo "======================================"
          echo "Derived Firefox builder"
          echo "======================================"

          docker image inspect \
            "$TERMUX_BUILDER_IMAGE_NAME" \
            --format \
            'ID={{.Id}} Size={{.Size}} Created={{.Created}}'

      # ============================================================
      # 12. Create Termux builder container
      #
      # IMPORTANT:
      #
      # /home/builder/termux-packages/.sccache
      # cannot be used because Termux restricted AppArmor denies
      # writes to most of the repository tree.
      #
      # Therefore:
      #
      # host:
      #   $GITHUB_WORKSPACE/.sccache
      #
      # container:
      #   /home/builder/.cache/sccache
      #
      # ============================================================
      - name: Start Termux builder
        shell: bash
        run: |
          set -euxo pipefail

          docker rm -f \
            termux-package-builder \
            2>/dev/null || true

          export TERMUX_DOCKER_RUN_EXTRA_ARGS="--volume ${GITHUB_WORKSPACE}/.sccache:/home/builder/.cache/sccache"

          ./scripts/run-docker.sh true

          echo
          echo "======================================"
          echo "Containers"
          echo "======================================"

          docker ps -a

          echo
          echo "======================================"
          echo "Container mounts"
          echo "======================================"

          docker inspect \
            termux-package-builder \
            --format '{{range .Mounts}}{{println .Source "->" .Destination}}{{end}}'

      # ============================================================
      # 13. Verify sccache binary
      # ============================================================
      - name: Verify sccache
        shell: bash
        run: |
          set -euxo pipefail

          ./scripts/run-docker.sh bash -lc '
            set -e

            echo "======================================"
            echo "sccache binary"
            echo "======================================"

            command -v sccache

            sccache --version
          '

      # ============================================================
      # 14. Verify cache directory is writable inside restricted
      #     Termux builder
      #
      # This prevents another hour-long build from starting if the
      # mount/AppArmor configuration is wrong.
      # ============================================================
      - name: Verify sccache cache access
        shell: bash
        run: |
          set -euxo pipefail

          ./scripts/run-docker.sh bash -lc '
            set -euxo pipefail

            export SCCACHE_DIR=/home/builder/.cache/sccache
            export SCCACHE_CACHE_SIZE=6G

            echo "======================================"
            echo "Identity"
            echo "======================================"

            id

            echo
            echo "======================================"
            echo "Cache directory"
            echo "======================================"

            ls -ld "$SCCACHE_DIR"

            echo
            echo "======================================"
            echo "Write test"
            echo "======================================"

            touch "$SCCACHE_DIR/.write-test"

            echo "test" \
              > "$SCCACHE_DIR/.write-test"

            cat "$SCCACHE_DIR/.write-test"

            rm "$SCCACHE_DIR/.write-test"

            echo
            echo "Cache write test: SUCCESS"
          '

      # ============================================================
      # 15. Patch current upstream free-space.sh
      #
      # Ubuntu 26.04 runner does not have ruby3.2-doc anymore.
      # ============================================================
      - name: Patch Termux free-space script
        shell: bash
        run: |
          set -euxo pipefail

          SCRIPT="scripts/free-space.sh"

          echo "======================================"
          echo "ruby3.2-doc before"
          echo "======================================"

          grep -n 'ruby3.2-doc' "$SCRIPT" || true

          sed -i \
            '/ruby3\.2-doc/d' \
            "$SCRIPT"

          echo
          echo "======================================"
          echo "ruby3.2-doc after"
          echo "======================================"

          if grep -n 'ruby3.2-doc' "$SCRIPT"; then
            echo "ERROR: ruby3.2-doc still exists"
            exit 1
          fi

          echo "ruby3.2-doc removed."

      # ============================================================
      # 16. Free GitHub runner disk space
      #
      # Docker builder/container are already created before this
      # because free-space.sh removes containerd cached layer data.
      # ============================================================
      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "Disk before cleanup"
          echo "======================================"

          df -h

          ./scripts/free-space.sh

          echo
          echo "======================================"
          echo "Disk after cleanup"
          echo "======================================"

          df -h

      # ============================================================
      # 17. Reset sccache stats
      # ============================================================
      - name: Reset sccache statistics
        shell: bash
        run: |
          set -euxo pipefail

          ./scripts/run-docker.sh \
            env \
              SCCACHE_DIR=/home/builder/.cache/sccache \
              SCCACHE_CACHE_SIZE=6G \
            sccache --zero-stats

      # ============================================================
      # 18. Build Firefox
      #
      # -f:
      #   force Firefox package itself to build
      #
      # -I:
      #   install dependencies from Termux repository rather than
      #   rebuilding every dependency
      # ============================================================
      - name: Build Firefox
        shell: bash
        run: |
          set -o pipefail

          echo "======================================"
          echo "Starting Firefox sandbox build"
          echo "======================================"

          ./scripts/run-docker.sh \
            env \
              SCCACHE_DIR=/home/builder/.cache/sccache \
              SCCACHE_CACHE_SIZE=6G \
            ./build-package.sh \
              -f \
              -I \
              -a aarch64 \
              firefox \
            2>&1 | tee firefox-build.log

      # ============================================================
      # 19. Show sccache statistics
      # ============================================================
      - name: Show sccache statistics
        if: always()
        shell: bash
        run: |
          ./scripts/run-docker.sh \
            env \
              SCCACHE_DIR=/home/builder/.cache/sccache \
              SCCACHE_CACHE_SIZE=6G \
            sccache --show-stats || true

      # ============================================================
      # 20. Build diagnostics
      # ============================================================
      - name: Build diagnostics
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "Firefox modifications"
          echo "======================================"

          git diff -- x11-packages/firefox/ || true

          echo
          echo "======================================"
          echo "Disk"
          echo "======================================"

          df -h || true

          echo
          echo "======================================"
          echo "Docker"
          echo "======================================"

          docker ps -a || true

          echo
          echo "======================================"
          echo "sccache host directory"
          echo "======================================"

          du -sh .sccache 2>/dev/null || true
          find .sccache -maxdepth 2 -type d \
            2>/dev/null | head -n 30 || true

          echo
          echo "======================================"
          echo "Generated DEB files"
          echo "======================================"

          find output \
            -type f \
            -name '*.deb' \
            -print \
            2>/dev/null || true

          find termux-packages/output \
            -type f \
            -name '*.deb' \
            -print \
            2>/dev/null || true

          echo
          echo "======================================"
          echo "Last 300 Firefox build lines"
          echo "======================================"

          tail -n 300 \
            firefox-build.log \
            2>/dev/null || true

      # ============================================================
      # 21. Collect successful Firefox package
      # ============================================================
      - name: Collect Firefox package
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          find \
            output \
            termux-packages/output \
            -type f \
            -name 'firefox_*.deb' \
            -print \
            -exec cp -v '{}' artifacts/ ';' \
            2>/dev/null || true

          cp \
            firefox-sandbox-changes.diff \
            artifacts/

          cp \
            x11-packages/firefox/9999-termux-sandbox-compat.patch \
            artifacts/

          DEB="$(
            find artifacts \
              -maxdepth 1 \
              -type f \
              -name 'firefox_*.deb' \
              -print -quit
          )"

          if [ -z "$DEB" ]; then
            echo "ERROR: Firefox .deb not found"
            exit 1
          fi

          (
            cd artifacts

            sha256sum \
              firefox_*.deb \
              > SHA256SUMS
          )

          echo
          echo "======================================"
          echo "Final Firefox artifacts"
          echo "======================================"

          ls -lh artifacts/

      # ============================================================
      # 22. Upload successful package
      # ============================================================
      - name: Upload Firefox sandbox package
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: firefox-sandbox-aarch64
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # ============================================================
      # 23. Always upload failure diagnostics
      # ============================================================
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: firefox-sandbox-build-diagnostics
          path: |
            firefox-build.log
            firefox-sandbox-changes.diff
            x11-packages/firefox/9999-termux-sandbox-compat.patch
          if-no-files-found: ignore
          retention-days: 14
