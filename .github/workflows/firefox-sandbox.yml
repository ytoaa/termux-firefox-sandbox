name: Build Termux Firefox with Sandbox

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firefox-sandbox-${{ github.ref }}
  cancel-in-progress: false

env:
  # run-docker.sh will use our derived image.
  TERMUX_BUILDER_IMAGE_NAME: termux-firefox-builder:sccache

jobs:
  build:
    name: Firefox Sandbox aarch64
    runs-on: ubuntu-26.04
    timeout-minutes: 355

    steps:
      # ============================================================
      # 1. Checkout latest upstream Termux packages
      # ============================================================
      - name: Checkout termux-packages
        uses: actions/checkout@v7
        with:
          repository: termux/termux-packages
          ref: master
          fetch-depth: 1

      # ============================================================
      # 2. Verify current Firefox recipe
      # ============================================================
      - name: Verify Firefox recipe
        shell: bash
        run: |
          set -euxo pipefail

          FIREFOX_DIR="x11-packages/firefox"
          MOZCONFIG="$FIREFOX_DIR/mozconfig.cfg"
          BUILD_SH="$FIREFOX_DIR/build.sh"

          test -d "$FIREFOX_DIR"
          test -f "$MOZCONFIG"
          test -f "$BUILD_SH"

          echo "=== Upstream commit ==="
          git rev-parse HEAD

          echo
          echo "=== Firefox version ==="
          grep '^TERMUX_PKG_VERSION=' "$BUILD_SH"
          grep '^TERMUX_PKG_REVISION=' "$BUILD_SH" || true

          echo
          echo "=== Current sandbox config ==="
          grep -n 'sandbox' "$MOZCONFIG"

          # Fail instead of silently building something unexpected
          # if Termux changes its Firefox configuration later.
          grep -q '^ac_add_options --disable-sandbox$' "$MOZCONFIG"

      # ============================================================
      # 3. Enable Firefox sandbox and sccache
      # ============================================================
      - name: Enable Firefox sandbox
        shell: bash
        run: |
          set -euxo pipefail

          MOZCONFIG="x11-packages/firefox/mozconfig.cfg"

          sed -i \
            's/^ac_add_options --disable-sandbox$/ac_add_options --enable-sandbox/' \
            "$MOZCONFIG"

          if ! grep -q '^ac_add_options --with-ccache=sccache$' "$MOZCONFIG"; then
            echo 'ac_add_options --with-ccache=sccache' >> "$MOZCONFIG"
          fi

          echo "=== Modified mozconfig ==="
          grep -nE 'sandbox|ccache' "$MOZCONFIG"

          grep -q '^ac_add_options --enable-sandbox$' "$MOZCONFIG"
          grep -q '^ac_add_options --with-ccache=sccache$' "$MOZCONFIG"

      # ============================================================
      # 4. Termux/Bionic compatibility patches for Mozilla
      #    Linux sandbox
      #
      # 1) <time.h> for struct timespec
      # 2) Disable pthread priority inheritance path on Termux
      # 3) Skip glibc-specific shm_open lazy initialization
      # ============================================================
      - name: Add Termux sandbox compatibility patch
        shell: bash
        run: |
          set -euxo pipefail

          PATCH="x11-packages/firefox/9999-termux-sandbox-compat.patch"

          cat > "$PATCH" <<'PATCH'
          --- a/security/sandbox/linux/reporter/SandboxReporterCommon.h
          +++ b/security/sandbox/linux/reporter/SandboxReporterCommon.h
          @@ -6,6 +6,7 @@
           #ifndef mozilla_SandboxReporterCommon_h
           #define mozilla_SandboxReporterCommon_h

          +#include <time.h>
           #include <sys/types.h>

           #include "mozilla/IntegerTypeTraits.h"

          --- a/security/sandbox/chromium/base/synchronization/lock_impl_posix.cc
          +++ b/security/sandbox/chromium/base/synchronization/lock_impl_posix.cc
          @@ -99,7 +99,7 @@
           // Lock::PriorityInheritanceAvailable still must be checked as the code may
           // compile but the underlying platform still may not correctly support priority
           // inheritance locks.
          -#if BUILDFLAG(IS_FUCHSIA)
          +#if BUILDFLAG(IS_FUCHSIA) || defined(__TERMUX__)
           #define PRIORITY_INHERITANCE_LOCKS_POSSIBLE() 0
           #else
           #define PRIORITY_INHERITANCE_LOCKS_POSSIBLE() 1

          --- a/security/sandbox/linux/Sandbox.cpp
          +++ b/security/sandbox/linux/Sandbox.cpp
          @@ -558,6 +558,7 @@
             }
           }

          +#if !defined(__TERMUX__)
           static void RunGlibcLazyInitializers() {
             // Make glibc's lazy initialization of shm_open() run before sandboxing
             int fd = shm_open("/dummy", O_RDONLY, 0);
          @@ -566,6 +567,7 @@
               close(fd);  // In the unlikely case we actually opened something
             }
           }
          +#endif

           static void SandboxLateInit() {
           #ifdef NIGHTLY_BUILD
          @@ -585,7 +587,9 @@
             }
           #endif

          +#if !defined(__TERMUX__)
             RunGlibcLazyInitializers();
          +#endif

             // This will run on main thread before  it is in a signal-handler context, to
             // make sure rprofiler pointers are properly initialized (and send a marker
          PATCH

          git add -N "$PATCH"

          echo "=== Compatibility patch ==="
          cat "$PATCH"

      # ============================================================
      # 5. Increase our package revision by one
      #
      # official 155.0.1   -> ours 155.0.1-1
      # official 155.0.1-2 -> ours 155.0.1-3
      # ============================================================
      - name: Increase custom package revision
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("x11-packages/firefox/build.sh")
          text = path.read_text()

          revision = re.search(
              r"^TERMUX_PKG_REVISION=(\d+)\s*$",
              text,
              flags=re.MULTILINE,
          )

          if revision:
              old = int(revision.group(1))
              new = old + 1

              text = (
                  text[:revision.start()]
                  + f"TERMUX_PKG_REVISION={new}"
                  + text[revision.end():]
              )
          else:
              version = re.search(
                  r"^TERMUX_PKG_VERSION=.*$",
                  text,
                  flags=re.MULTILINE,
              )

              if not version:
                  raise SystemExit("TERMUX_PKG_VERSION not found")

              text = (
                  text[:version.end()]
                  + "\nTERMUX_PKG_REVISION=1"
                  + text[version.end():]
              )

          path.write_text(text)
          PY

          echo "=== Custom Firefox version ==="
          grep '^TERMUX_PKG_VERSION=' x11-packages/firefox/build.sh
          grep '^TERMUX_PKG_REVISION=' x11-packages/firefox/build.sh

      # ============================================================
      # 6. Save modifications for diagnostics
      # ============================================================
      - name: Save custom changes
        shell: bash
        run: |
          set -euxo pipefail

          git diff -- x11-packages/firefox/ \
            | tee firefox-sandbox-changes.diff

          echo
          echo "=== Git status ==="
          git status --short x11-packages/firefox/

      # ============================================================
      # 7. Restore persistent compiler cache
      #
      # Unique key allows the updated cache to be saved each run.
      # restore-keys retrieves the newest previous Firefox cache.
      # ============================================================
      - name: Restore Firefox sccache
        uses: actions/cache@v4
        with:
          path: .sccache
          key: firefox-sccache-aarch64-v3-${{ github.run_id }}
          restore-keys: |
            firefox-sccache-aarch64-v3-

      - name: Prepare sccache directory
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p .sccache
          chmod 0777 .sccache

      # ============================================================
      # 8. Firefox needs substantial RAM
      # ============================================================
      - name: Enable zram
        uses: ./.github/actions/zram
        with:
          algorithm: zstd
          size: 16G
          priority: 100
          device_name: /dev/zram0

      # ============================================================
      # 9. Prepare original Termux builder
      #
      # Do NOT use $TERMUX_BUILDER_IMAGE_NAME here because that points
      # at our derived image. We explicitly pull/build the base image.
      # ============================================================
      - name: Prepare official Termux builder
        shell: bash
        run: |
          set -euo pipefail

          BASE_IMAGE="ghcr.io/termux/package-builder:latest"
          PULLED=0

          for attempt in 1 2 3 4 5; do
            echo
            echo "======================================"
            echo "Base image pull attempt ${attempt}/5"
            echo "======================================"

            if docker pull "$BASE_IMAGE"; then
              PULLED=1
              break
            fi

            echo "Docker pull failed."

            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 15))
              echo "Retrying in ${delay}s..."
              sleep "$delay"
            fi
          done

          if [ "$PULLED" -ne 1 ]; then
            echo
            echo "======================================"
            echo "GHCR unavailable"
            echo "Building official Termux builder locally"
            echo "======================================"

            docker build \
              -t "$BASE_IMAGE" \
              scripts/

            docker buildx prune -af || true
          fi

          echo
          echo "=== Base builder ==="

          docker image inspect "$BASE_IMAGE" \
            --format 'ID={{.Id}} Size={{.Size}} Created={{.Created}}'

      # ============================================================
      # 10. Build our derived builder containing sccache
      #
      # IMPORTANT:
      # This is done BEFORE run-docker.sh creates the restricted
      # container. apt runs as root during docker build, not under
      # Termux's restricted AppArmor profile.
      # ============================================================
      - name: Build Firefox builder with sccache
        shell: bash
        run: |
          set -euxo pipefail

          cat > /tmp/Dockerfile.firefox-sccache <<'DOCKERFILE'
          FROM ghcr.io/termux/package-builder:latest

          USER root

          RUN apt-get update \
              && apt-get install -yq --no-install-recommends sccache \
              && apt-get clean \
              && rm -rf /var/lib/apt/lists/*

          USER builder:builder
          WORKDIR /home/builder/termux-packages
          DOCKERFILE

          docker build \
            -f /tmp/Dockerfile.firefox-sccache \
            -t "$TERMUX_BUILDER_IMAGE_NAME" \
            .

          echo
          echo "=== Derived Firefox builder ==="

          docker image inspect "$TERMUX_BUILDER_IMAGE_NAME" \
            --format 'ID={{.Id}} Size={{.Size}} Created={{.Created}}'

      # ============================================================
      # 11. Start builder container
      #
      # run-docker.sh now sees:
      #
      # TERMUX_BUILDER_IMAGE_NAME=termux-firefox-builder:sccache
      #
      # so it uses our derived image.
      # ============================================================
      - name: Start Termux builder
        shell: bash
        run: |
          set -euxo pipefail

          docker rm -f termux-package-builder 2>/dev/null || true

          ./scripts/run-docker.sh true

          echo
          echo "=== Containers ==="
          docker ps -a

      # ============================================================
      # 12. Verify sccache
      #
      # No sudo. No apt. Only execute already-installed binary.
      # This is safe under the restricted AppArmor profile.
      # ============================================================
      - name: Verify sccache
        shell: bash
        run: |
          set -euxo pipefail

          ./scripts/run-docker.sh bash -lc '
            echo "=== sccache ==="
            command -v sccache
            sccache --version
          '

      # ============================================================
      # 13. Work around current upstream free-space.sh bug
      #
      # Ubuntu 26.04 no longer has ruby3.2-doc, while the Termux
      # script still asks apt to purge it.
      # ============================================================
      - name: Patch Termux free-space script
        shell: bash
        run: |
          set -euxo pipefail

          SCRIPT="scripts/free-space.sh"

          echo "=== Before ==="
          grep -n 'ruby3.2-doc' "$SCRIPT" || true

          sed -i \
            '/^[[:space:]]*ruby3\.2-doc[[:space:]]*\\[[:space:]]*$/d' \
            "$SCRIPT"

          echo
          echo "=== After ==="

          if grep -n 'ruby3.2-doc' "$SCRIPT"; then
            echo "ERROR: ruby3.2-doc still present"
            exit 1
          fi

          echo "ruby3.2-doc entry removed."

      # ============================================================
      # 14. Free host runner disk
      #
      # Builder image/container was already created, matching the
      # intended Termux CI ordering.
      # ============================================================
      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Before ==="
          df -h

          ./scripts/free-space.sh

          echo
          echo "=== After ==="
          df -h

      # ============================================================
      # 15. Reset compiler-cache statistics
      # ============================================================
      - name: Reset sccache statistics
        shell: bash
        run: |
          ./scripts/run-docker.sh \
            env \
              SCCACHE_DIR=/home/builder/termux-packages/.sccache \
              SCCACHE_CACHE_SIZE=6G \
            sccache --zero-stats || true

      # ============================================================
      # 16. Build Firefox
      #
      # -f = force Firefox package itself
      # -I = install dependencies from Termux repo
      # ============================================================
      - name: Build Firefox
        shell: bash
        run: |
          set -o pipefail

          echo "======================================"
          echo "Starting Firefox sandbox build"
          echo "======================================"

          ./scripts/run-docker.sh \
            env \
              SCCACHE_DIR=/home/builder/termux-packages/.sccache \
              SCCACHE_CACHE_SIZE=6G \
            ./build-package.sh \
              -f \
              -I \
              -a aarch64 \
              firefox \
            2>&1 | tee firefox-build.log

      # ============================================================
      # 17. Cache statistics
      # ============================================================
      - name: Show sccache statistics
        if: always()
        shell: bash
        run: |
          ./scripts/run-docker.sh \
            env \
              SCCACHE_DIR=/home/builder/termux-packages/.sccache \
              SCCACHE_CACHE_SIZE=6G \
            sccache --show-stats || true

      # ============================================================
      # 18. Diagnostics
      # ============================================================
      - name: Build diagnostics
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "Firefox modifications"
          echo "======================================"

          git diff -- x11-packages/firefox/ || true

          echo
          echo "======================================"
          echo "Disk"
          echo "======================================"

          df -h || true

          echo
          echo "======================================"
          echo "Docker"
          echo "======================================"

          docker ps -a || true

          echo
          echo "======================================"
          echo "Generated DEBs"
          echo "======================================"

          find output \
            -type f \
            -name '*.deb' \
            -print \
            2>/dev/null || true

          find termux-packages/output \
            -type f \
            -name '*.deb' \
            -print \
            2>/dev/null || true

          echo
          echo "======================================"
          echo "Last 300 build lines"
          echo "======================================"

          tail -n 300 firefox-build.log \
            2>/dev/null || true

      # ============================================================
      # 19. Collect successful package
      # ============================================================
      - name: Collect Firefox package
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          find output termux-packages/output \
            -type f \
            -name 'firefox_*.deb' \
            -print \
            -exec cp -v '{}' artifacts/ ';' \
            2>/dev/null || true

          cp firefox-sandbox-changes.diff artifacts/

          cp \
            x11-packages/firefox/9999-termux-sandbox-compat.patch \
            artifacts/

          DEB="$(
            find artifacts \
              -maxdepth 1 \
              -type f \
              -name 'firefox_*.deb' \
              -print -quit
          )"

          if [ -z "$DEB" ]; then
            echo "ERROR: Firefox .deb not found."
            exit 1
          fi

          (
            cd artifacts
            sha256sum firefox_*.deb > SHA256SUMS
          )

          echo
          echo "=== Final artifacts ==="
          ls -lh artifacts/

      # ============================================================
      # 20. Upload successful package
      # ============================================================
      - name: Upload Firefox sandbox package
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: firefox-sandbox-aarch64
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # ============================================================
      # 21. Always upload failure diagnostics
      # ============================================================
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: firefox-sandbox-build-diagnostics
          path: |
            firefox-build.log
            firefox-sandbox-changes.diff
            x11-packages/firefox/9999-termux-sandbox-compat.patch
          if-no-files-found: ignore
          retention-days: 14
