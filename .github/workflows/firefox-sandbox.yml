name: Build Termux Firefox with Sandbox

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firefox-sandbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Firefox Sandbox aarch64
    runs-on: ubuntu-26.04
    timeout-minutes: 355

    steps:
      # ============================================================
      # 1. Always use current upstream Termux package recipes
      # ============================================================
      - name: Checkout termux-packages
        uses: actions/checkout@v7
        with:
          repository: termux/termux-packages
          ref: master
          fetch-depth: 1

      # ============================================================
      # 2. Verify upstream Firefox recipe
      # ============================================================
      - name: Verify Firefox recipe
        shell: bash
        run: |
          set -euxo pipefail

          FIREFOX_DIR="x11-packages/firefox"
          MOZCONFIG="$FIREFOX_DIR/mozconfig.cfg"
          BUILD_SH="$FIREFOX_DIR/build.sh"

          test -d "$FIREFOX_DIR"
          test -f "$MOZCONFIG"
          test -f "$BUILD_SH"

          echo "=== Upstream Termux commit ==="
          git rev-parse HEAD

          echo
          echo "=== Firefox version ==="
          grep '^TERMUX_PKG_VERSION=' "$BUILD_SH"
          grep '^TERMUX_PKG_REVISION=' "$BUILD_SH" || true

          echo
          echo "=== Current sandbox config ==="
          grep -n 'sandbox' "$MOZCONFIG"

          # Fail safely if Termux changes this in the future.
          grep -q '^ac_add_options --disable-sandbox$' "$MOZCONFIG"

      # ============================================================
      # 3. Enable Firefox sandbox + compiler cache
      # ============================================================
      - name: Enable Firefox sandbox
        shell: bash
        run: |
          set -euxo pipefail

          MOZCONFIG="x11-packages/firefox/mozconfig.cfg"

          sed -i \
            's/^ac_add_options --disable-sandbox$/ac_add_options --enable-sandbox/' \
            "$MOZCONFIG"

          if ! grep -q '^ac_add_options --with-ccache=sccache$' "$MOZCONFIG"; then
            echo 'ac_add_options --with-ccache=sccache' >> "$MOZCONFIG"
          fi

          echo "=== Modified mozconfig ==="
          grep -nE 'sandbox|ccache' "$MOZCONFIG"

          grep -q '^ac_add_options --enable-sandbox$' "$MOZCONFIG"

      # ============================================================
      # 4. Add Linux sandbox compatibility fixes for Termux/Bionic
      #
      # Fix 1:
      #   explicitly include <time.h> for struct timespec
      #
      # Fix 2:
      #   disable priority-inheritance pthread mutex path on Termux
      #
      # Fix 3:
      #   skip glibc-specific shm_open lazy initialization on Bionic
      # ============================================================
      - name: Add Termux sandbox compatibility patch
        shell: bash
        run: |
          set -euxo pipefail

          PATCH="x11-packages/firefox/9999-termux-sandbox-compat.patch"

          cat > "$PATCH" <<'PATCH'
          --- a/security/sandbox/linux/reporter/SandboxReporterCommon.h
          +++ b/security/sandbox/linux/reporter/SandboxReporterCommon.h
          @@ -6,6 +6,7 @@
           #ifndef mozilla_SandboxReporterCommon_h
           #define mozilla_SandboxReporterCommon_h

          +#include <time.h>
           #include <sys/types.h>

           #include "mozilla/IntegerTypeTraits.h"

          --- a/security/sandbox/chromium/base/synchronization/lock_impl_posix.cc
          +++ b/security/sandbox/chromium/base/synchronization/lock_impl_posix.cc
          @@ -99,7 +99,7 @@
           // Lock::PriorityInheritanceAvailable still must be checked as the code may
           // compile but the underlying platform still may not correctly support priority
           // inheritance locks.
          -#if BUILDFLAG(IS_FUCHSIA)
          +#if BUILDFLAG(IS_FUCHSIA) || defined(__TERMUX__)
           #define PRIORITY_INHERITANCE_LOCKS_POSSIBLE() 0
           #else
           #define PRIORITY_INHERITANCE_LOCKS_POSSIBLE() 1

          --- a/security/sandbox/linux/Sandbox.cpp
          +++ b/security/sandbox/linux/Sandbox.cpp
          @@ -558,6 +558,7 @@
             }
           }

          +#if !defined(__TERMUX__)
           static void RunGlibcLazyInitializers() {
             // Make glibc's lazy initialization of shm_open() run before sandboxing
             int fd = shm_open("/dummy", O_RDONLY, 0);
          @@ -566,6 +567,7 @@
               close(fd);  // In the unlikely case we actually opened something
             }
           }
          +#endif

           static void SandboxLateInit() {
           #ifdef NIGHTLY_BUILD
          @@ -585,7 +587,9 @@
             }
           #endif

          +#if !defined(__TERMUX__)
             RunGlibcLazyInitializers();
          +#endif

             // This will run on main thread before  it is in a signal-handler context, to
             // make sure rprofiler pointers are properly initialized (and send a marker
          PATCH

          echo "=== Compatibility patch ==="
          cat "$PATCH"

          # Make the new file visible in git diff without committing it.
          git add -N "$PATCH"

      # ============================================================
      # 5. Raise package revision above official Termux Firefox
      #
      # Examples:
      # official 155.0.1   -> ours 155.0.1-1
      # official 155.0.1-2 -> ours 155.0.1-3
      # ============================================================
      - name: Increase custom package revision
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("x11-packages/firefox/build.sh")
          text = path.read_text()

          revision = re.search(
              r"^TERMUX_PKG_REVISION=(\d+)\s*$",
              text,
              flags=re.MULTILINE,
          )

          if revision:
              old_revision = int(revision.group(1))
              new_revision = old_revision + 1

              text = (
                  text[:revision.start()]
                  + f"TERMUX_PKG_REVISION={new_revision}"
                  + text[revision.end():]
              )
          else:
              version = re.search(
                  r"^TERMUX_PKG_VERSION=.*$",
                  text,
                  flags=re.MULTILINE,
              )

              if not version:
                  raise SystemExit("TERMUX_PKG_VERSION not found")

              text = (
                  text[:version.end()]
                  + "\nTERMUX_PKG_REVISION=1"
                  + text[version.end():]
              )

          path.write_text(text)
          PY

          echo "=== Custom package version ==="
          grep '^TERMUX_PKG_VERSION=' x11-packages/firefox/build.sh
          grep '^TERMUX_PKG_REVISION=' x11-packages/firefox/build.sh

      # ============================================================
      # 6. Save our modifications
      # ============================================================
      - name: Save custom changes
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Firefox modifications ==="

          git diff -- x11-packages/firefox/ \
            | tee firefox-sandbox-changes.diff

          echo
          echo "=== Git status ==="
          git status --short x11-packages/firefox/

      # ============================================================
      # 7. Restore compiler cache
      #
      # First build will have mostly misses.
      # Following builds can reuse previous C/C++/Rust objects.
      # ============================================================
      - name: Restore Firefox sccache
        uses: actions/cache@v4
        with:
          path: .sccache
          key: firefox-sccache-aarch64-v2-${{ github.run_id }}
          restore-keys: |
            firefox-sccache-aarch64-v2-

      - name: Prepare sccache directory
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p .sccache
          chmod 0777 .sccache

      # ============================================================
      # 8. Firefox is a huge package.
      #    Same zram size used by Termux CI.
      # ============================================================
      - name: Enable zram
        uses: ./.github/actions/zram
        with:
          algorithm: zstd
          size: 16G
          priority: 100
          device_name: /dev/zram0

      # ============================================================
      # 9. Pull official Termux builder with retry.
      #
      # GitHub GHCR occasionally gives:
      # connection reset by peer
      #
      # If all pulls fail, build builder locally.
      # ============================================================
      - name: Prepare Termux Docker builder
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/termux/package-builder:latest"
          PULLED=0

          for attempt in 1 2 3 4 5; do
            echo
            echo "======================================"
            echo "Docker pull attempt ${attempt}/5"
            echo "======================================"

            if docker pull "$IMAGE"; then
              PULLED=1
              break
            fi

            echo "Docker pull failed."

            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 15))
              echo "Retrying in ${delay}s..."
              sleep "$delay"
            fi
          done

          if [ "$PULLED" -ne 1 ]; then
            echo
            echo "======================================"
            echo "GHCR unavailable."
            echo "Building Termux builder locally."
            echo "======================================"

            docker build \
              -t "$IMAGE" \
              scripts/

            docker buildx prune -af || true
          fi

          echo
          echo "=== Builder image ==="

          docker image inspect "$IMAGE" \
            --format 'ID={{.Id}} Size={{.Size}} Created={{.Created}}'

      # ============================================================
      # 10. Start Termux builder BEFORE freeing space.
      #
      # free-space.sh removes compressed container layers, so Docker
      # image needs to be inflated first.
      # ============================================================
      - name: Start Termux builder
        shell: bash
        run: |
          set -euxo pipefail

          docker rm -f termux-package-builder 2>/dev/null || true

          ./scripts/run-docker.sh true

          echo
          docker ps -a

      # ============================================================
      # 11. Fix current Termux free-space.sh issue on Ubuntu 26.04
      #
      # Upstream script currently tries to purge ruby3.2-doc.
      # That package no longer exists on the GitHub ubuntu-26.04
      # runner and causes apt purge to return an error.
      # ============================================================
      - name: Patch Termux free-space script
        shell: bash
        run: |
          set -euxo pipefail

          SCRIPT="scripts/free-space.sh"

          echo "=== Before ==="
          grep -n 'ruby3.2-doc' "$SCRIPT" || true

          sed -i \
            '/^[[:space:]]*ruby3\.2-doc[[:space:]]*\\[[:space:]]*$/d' \
            "$SCRIPT"

          echo
          echo "=== After ==="

          if grep -n 'ruby3.2-doc' "$SCRIPT"; then
            echo "ERROR: ruby3.2-doc entry still exists."
            exit 1
          else
            echo "ruby3.2-doc removed successfully."
          fi

      # ============================================================
      # 12. Free GitHub runner disk
      # ============================================================
      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Before ==="
          df -h

          ./scripts/free-space.sh

          echo
          echo "=== After ==="
          df -h

      # ============================================================
      # 13. Install sccache inside the Termux builder
      # ============================================================
      - name: Install sccache in builder
        shell: bash
        run: |
          set -euxo pipefail

          ./scripts/run-docker.sh bash -lc '
            set -e

            if ! command -v sccache >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y sccache
            fi

            echo "=== sccache ==="
            command -v sccache
            sccache --version
          '

      # ============================================================
      # 14. Reset sccache statistics for this run
      # ============================================================
      - name: Reset sccache statistics
        shell: bash
        run: |
          ./scripts/run-docker.sh \
            env \
              SCCACHE_DIR=/home/builder/termux-packages/.sccache \
              SCCACHE_CACHE_SIZE=6G \
            sccache --zero-stats || true

      # ============================================================
      # 15. Build Firefox
      #
      # -f = force Firefox build
      # -I = download dependencies instead of rebuilding them
      # ============================================================
      - name: Build Firefox
        shell: bash
        run: |
          set -o pipefail

          echo "======================================"
          echo "Starting Firefox sandbox build"
          echo "======================================"

          ./scripts/run-docker.sh \
            env \
              SCCACHE_DIR=/home/builder/termux-packages/.sccache \
              SCCACHE_CACHE_SIZE=6G \
            ./build-package.sh \
              -f \
              -I \
              -a aarch64 \
              firefox \
            2>&1 | tee firefox-build.log

      # ============================================================
      # 16. Show compiler cache statistics
      # ============================================================
      - name: Show sccache statistics
        if: always()
        shell: bash
        run: |
          ./scripts/run-docker.sh \
            env \
              SCCACHE_DIR=/home/builder/termux-packages/.sccache \
              SCCACHE_CACHE_SIZE=6G \
            sccache --show-stats || true

      # ============================================================
      # 17. Diagnostics even on build failure
      # ============================================================
      - name: Build diagnostics
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "Firefox package modifications"
          echo "======================================"

          git diff -- x11-packages/firefox/ || true

          echo
          echo "======================================"
          echo "Disk space"
          echo "======================================"

          df -h || true

          echo
          echo "======================================"
          echo "Docker containers"
          echo "======================================"

          docker ps -a || true

          echo
          echo "======================================"
          echo "Generated .deb files"
          echo "======================================"

          find output \
            -type f \
            -name '*.deb' \
            -print \
            2>/dev/null || true

          find termux-packages/output \
            -type f \
            -name '*.deb' \
            -print \
            2>/dev/null || true

          echo
          echo "======================================"
          echo "Last 300 build log lines"
          echo "======================================"

          tail -n 300 firefox-build.log \
            2>/dev/null || true

      # ============================================================
      # 18. Collect successful Firefox package
      # ============================================================
      - name: Collect Firefox package
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          find output termux-packages/output \
            -type f \
            -name 'firefox_*.deb' \
            -print \
            -exec cp -v '{}' artifacts/ ';' \
            2>/dev/null || true

          cp firefox-sandbox-changes.diff artifacts/

          cp \
            x11-packages/firefox/9999-termux-sandbox-compat.patch \
            artifacts/

          DEB="$(
            find artifacts \
              -maxdepth 1 \
              -type f \
              -name 'firefox_*.deb' \
              -print -quit
          )"

          if [ -z "$DEB" ]; then
            echo "ERROR: Firefox .deb was not found."
            exit 1
          fi

          (
            cd artifacts
            sha256sum firefox_*.deb > SHA256SUMS
          )

          echo
          echo "======================================"
          echo "Final artifacts"
          echo "======================================"

          ls -lh artifacts/

      # ============================================================
      # 19. Upload successful Firefox .deb
      # ============================================================
      - name: Upload Firefox sandbox package
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: firefox-sandbox-aarch64
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # ============================================================
      # 20. Always keep failure diagnostics
      # ============================================================
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: firefox-sandbox-build-diagnostics
          path: |
            firefox-build.log
            firefox-sandbox-changes.diff
            x11-packages/firefox/9999-termux-sandbox-compat.patch
          if-no-files-found: ignore
          retention-days: 14
