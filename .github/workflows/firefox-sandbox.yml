name: Build Firefox with Sandbox

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-firefox:
    runs-on: ubuntu-26.04
    timeout-minutes: 350

    steps:
      - name: Checkout Termux packages
        uses: actions/checkout@v7
        with:
          repository: termux/termux-packages
          ref: master
          fetch-depth: 1

      - name: Verify repository
        run: |
          pwd
          git remote -v
          ls -la
          ls -la x11-packages/firefox
          grep -n sandbox x11-packages/firefox/mozconfig.cfg

      - name: Enable Firefox sandbox
        shell: bash
        run: |
          set -euxo pipefail

          FILE="x11-packages/firefox/mozconfig.cfg"

          echo "Before:"
          grep -n sandbox "$FILE"

          grep -q '^ac_add_options --disable-sandbox$' "$FILE"

          sed -i \
            's/^ac_add_options --disable-sandbox$/ac_add_options --enable-sandbox/' \
            "$FILE"

          echo "After:"
          grep -n sandbox "$FILE"

          echo
          echo "Diff:"
          git diff -- "$FILE"

          grep -q '^ac_add_options --enable-sandbox$' "$FILE"

      - name: Enable zram
        uses: ./.github/actions/zram
        with:
          algorithm: zstd
          size: 16G
          priority: 100
          device_name: /dev/zram0

      - name: Load Termux builder
        run: |
          ./scripts/run-docker.sh true

      - name: Free disk space
        run: |
          ./scripts/free-space.sh
          df -h

      - name: Build Firefox aarch64
        shell: bash
        run: |
          set -o pipefail

          ./scripts/run-docker.sh \
            ./build-package.sh \
            -f -I -a aarch64 firefox \
            2>&1 | tee firefox-build.log

      - name: Collect package
        if: success()
        shell: bash
        run: |
          mkdir -p artifacts

          echo "Build output:"
          find output -maxdepth 1 -type f -name '*.deb' -ls || true

          find output -maxdepth 1 \
            -type f \
            -name 'firefox_*.deb' \
            -exec cp -v '{}' artifacts/ ';'

          test -n "$(find artifacts -type f -name 'firefox_*.deb' -print -quit)"

          sha256sum artifacts/*.deb > artifacts/SHA256SUMS
          ls -lh artifacts

      - name: Upload Firefox package
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: firefox-sandbox-aarch64
          path: artifacts/
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: firefox-sandbox-build-log
          path: firefox-build.log
          if-no-files-found: ignore
